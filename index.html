<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%221%22 x2=%221%22 y2=%220%22%3E%3Cstop offset=%220%22 stop-color=%22%23FC5200%22/%3E%3Cstop offset=%221%22 stop-color=%22%23FFB347%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d=%22M14 5H43V34L34 43H5V14Z%22 fill=%22url%28%23g%29%22 stroke=%22url%28%23g%29%22 stroke-width=%224%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M10 30h6l3.5-7 4.5 12 6.5-21 4.5 11h3.5%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ÉLAN">
<title>Tableau de forme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Oxanium:wght@400;500;600;700;800&display=swap">
<style>
/* Parti pris : écran d'appli de sport, fond sombre unique, un seul orange vif, lettrage géométrique « tableau de bord ». Mobile d'abord. */
:root {
  --bg: #121212; --card: #1C1C1E; --card2: #2C2C30; --line: #323236; --grid: #383838;
  --fg: #FFFFFF; --fg2: #BDBDBD; --fg3: #8C8C8C; --acc: #FC5200; --acc2: #FFB347; --tint: rgba(252, 82, 0, .15);
  --font: "Oxanium", "Segoe UI", system-ui, -apple-system, sans-serif;
  --disp: "Orbitron", "Oxanium", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 16px; font-weight: 700; letter-spacing: .03em; }
h3 { font-size: 15px; font-weight: 700; }
.muted { color: var(--fg2); font-size: 13px; }
small { font-size: .5em; font-weight: 700; margin-left: .25em; color: var(--fg); }
.e { font-size: 1.1em; line-height: 1; margin-right: .4em; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
button .e, .chip .e, .tog .e { transform: translateY(-.18em); }   /* boutons : l'emoji descend sous l'axe du texte, on le remonte */
/* Oxanium a plus de place sous la ligne qu'au-dessus : les boutons ont 4 px de marge de plus en haut qu'en bas pour centrer le texte en hauteur */

#app { margin: 0 auto; padding-block: 18px 48px; display: flex; flex-direction: column; gap: 14px; max-width: 1120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* en-tête : logo, titre */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { flex: none; filter: drop-shadow(0 0 10px rgba(252, 82, 0, .5)); }
h1 { font-family: var(--disp); font-size: 27px; font-weight: 800; letter-spacing: .22em; line-height: 1;
  background: linear-gradient(90deg, #fff 25%, var(--acc2) 70%, var(--acc)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tag { margin-top: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--fg2); }
.maj { font-size: 12px; letter-spacing: .04em; }
/* PPS : pastille sous la date (PC) ou à côté (téléphone) ; orange à moins de 30 jours de l'échéance, rouge une fois expiré */
.hmeta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
/* logos Strava / Garmin / Nolio / Campus : tout petits, à gauche de la date (PC) ou à droite (téléphone) */
.hsub { display: flex; align-items: center; gap: 12px; } .hl { display: flex; gap: 7px; }
.hl a { display: block; line-height: 0; opacity: .75; transition: opacity .15s; } .hl a:hover, .hl a:focus-visible { opacity: 1; } .hl img { border-radius: 4px; }
@media (max-width: 759px) { .hl { gap: 9px; } .hl img { width: 22px; height: 22px; border-radius: 5px; } }   /* logos plus grands sur téléphone */
.pps { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--fg2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.pps b { color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: .03em; user-select: all; } .pps .pl, .pps .pc { color: var(--fg3); } .pps .pc { display: none; }
.pps .pn { display: inline-flex; align-items: center; gap: 3px; }
.pps .cp { display: inline-grid; place-items: center; width: 22px; height: 22px; margin: -4px -6px -4px 0; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--fg3); cursor: pointer; }
.pps .cp svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.pps .cp:hover, .pps .cp:focus-visible { color: var(--fg); background: rgba(255, 255, 255, .08); outline: none; } .pps .cp.ok { color: #4CD97B; } .pps .cp.ok svg { stroke-width: 2; }
.pps.near { border-color: #FFC24D; } .pps.over { border-color: #FF6B6B; } .pps.near .pc { color: #FFC24D; } .pps.over .pl, .pps.over .pc { color: #FF6B6B; }
/* téléphone : logos des comptes en haut à droite à côté du logo ; ligne suivante « Données au » à gauche, PPS à droite (numéro, puis date courte dessous) */
@media (max-width: 759px) {
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 8px; } .hmeta, .hsub { display: contents; }
  .hl { grid-column: 2; grid-row: 1; } .maj { grid-column: 1; grid-row: 2; align-self: center; }
  .pps { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; border: 0; padding: 0; border-radius: 0; }
  .pps .e, .pps .pl { display: none; } .pps .pc { display: block; font-size: 11px; }
}

/* navigation : barre flottante en verre dépoli, qui reste en haut de l'écran pendant le défilement */
.dock { position: sticky; top: max(8px, env(safe-area-inset-top, 0px)); z-index: 30; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px;
  background: rgba(30, 30, 33, .72); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
  border: 1px solid rgba(255, 255, 255, .1); border-radius: 16px; box-shadow: 0 10px 28px rgba(0, 0, 0, .5); }
.dock button { display: flex; align-items: center; justify-content: center; background: none; border: 0; border-radius: 12px; padding: 11px 4px 7px; font-size: 13.5px; font-weight: 700; letter-spacing: .03em; color: var(--fg2); white-space: nowrap; transition: color .15s, background .15s; }
.dock button:hover { color: var(--fg); }
.dock button.on { background: linear-gradient(135deg, var(--acc), #FF7A2E); color: #fff; box-shadow: 0 4px 16px rgba(252, 82, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .25); text-shadow: 0 1px 2px rgba(0, 0, 0, .35); }

/* filtres : étiquettes fines, sélection teintée */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 34px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 34px), transparent); }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px 4px 9px; font-size: 13px; font-weight: 600; letter-spacing: .01em; color: var(--fg2); white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.chip:hover { border-color: #5a5a5f; color: var(--fg); }
.chip.on { background: color-mix(in srgb, var(--mc, var(--acc)) 16%, transparent); border-color: var(--mc, var(--acc)); color: var(--fg); }
.ranges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.ranges button { background: none; border: 0; border-radius: 9px; padding: 9px 4px 5px; font-size: 13px; font-weight: 700; color: var(--fg2); white-space: nowrap; }
.ranges button:hover { color: var(--fg); }
.ranges button.on { background: var(--acc); color: #fff; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tog { display: inline-flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 9px 4px; font-size: 12.5px; font-weight: 600; color: var(--fg2); transition: border-color .15s, color .15s; }
.tog i { position: relative; flex: none; width: 26px; height: 14px; margin-left: 8px; border-radius: 999px; background: #47474c; transition: background .15s; }
.tog i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #c9c9c9; transition: transform .15s, background .15s; }
.tog.on { color: var(--fg); border-color: #5a5a5f; }
.tog.on i { background: var(--acc); } .tog.on i::after { transform: translateX(12px); background: #fff; }
.tog:disabled { opacity: .4; cursor: not-allowed; }
@media (max-width: 759px) { .opts > * { flex: 1 1 auto; } .opts .tog { justify-content: space-between; } .opts .seg { display: flex; } .opts .seg button { flex: 1; justify-content: center; } }   /* options sous les périodes : chaque ligne occupe toute la largeur sur téléphone */
.tog .ts { display: none; }
@media (max-width: 759px) { .opts.one { flex-wrap: nowrap; gap: 5px; } .opts.one .tog { flex: 1 1 auto; justify-content: center; padding: 7px 6px 3px; font-size: 12px; white-space: nowrap; } .opts.one .tog i { display: none; } .opts.one .tog .e { margin-right: 4px; } .opts.one .tl { display: none; } .opts.one .ts { display: inline; } .opts.one .tog.on { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, var(--card)); } }   /* page Charge : les 3 options sur une ligne (sans interrupteur, l'option active est teintée) */
.seg { display: inline-flex; align-self: flex-start; max-width: 100%; gap: 2px; padding: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { display: inline-flex; align-items: center; background: none; border: 0; border-radius: 7px; padding: 7px 10px 3px; font-size: 12.5px; font-weight: 600; color: var(--fg2); white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--card2); color: var(--fg); }
.seg.sm button { padding: 5px 8px 1px; font-size: 11.5px; }
.simn { font-size: 12px; color: var(--fg3); }

/* chiffres */
.lbl { font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--fg2); }
.delta { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta i { font-style: normal; font-size: .7em; margin-right: .35em; color: var(--fg2); }
/* vue Indicateur : total (ou valeur) en haut à gauche de la courbe, sur un voile pour rester lisible ; l'infobulle passe au-dessus */
.cwrap { position: relative; }
.ctot { position: absolute; left: 4px; z-index: 1; pointer-events: none; display: flex; flex-direction: column; padding: 2px 8px 4px 4px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 72%, transparent); }
.ctot b { font-size: 22px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; } .ctot b small { font-size: 13px; } .ctot span { font-size: 11px; color: var(--fg2); }
.brief2 { display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13px; line-height: 1.4; color: var(--fg2); }
.bl { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; cursor: pointer; }
.bl.open { display: block; -webkit-line-clamp: unset; } .bl b { color: var(--fg); font-weight: 700; } .bl b a { color: var(--fg); text-decoration: none; } .bl .bd { color: var(--fg2); font-weight: 500; }
.bl .bx { color: var(--fg3, var(--fg2)); }
.bl + .bl { border-top: 1px solid var(--line); padding-top: 6px; }
.brief2.bs { background: color-mix(in srgb, #3FA7F5 13%, var(--card)); border-color: color-mix(in srgb, #3FA7F5 30%, var(--line)); }   /* bloc d'analyse (séance, nuit, VFC) teinté en entier */
.brief2 + .brief2 { margin-top: -6px; }
.wk-t { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; } .wk-t div { background: var(--card2); border-radius: 10px; padding: 7px 10px; display: flex; flex-direction: column; } .wk-t b { color: var(--fg); font-size: 18px; } .wk-t span { font-size: 12px; color: var(--fg3); }
.wk-l { list-style: none; padding: 0 !important; } .wk-l li { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); } .wk-l li + li { margin-top: 0 !important; }
.wk-j { flex: 0 0 52px; color: var(--fg3); font-size: 12px; } .wk-l a { color: inherit; text-decoration: none; }
/* fenêtre d'analyse complète d'une séance, ouverte au clic sur la ligne « Dernière séance » */
#an-dlg { width: min(680px, calc(100vw - 24px)); max-height: 86vh; max-height: 86dvh; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--fg2); }
#an-dlg::backdrop { background: rgba(0, 0, 0, .65); }
.an { padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 8px; }
.an h2 { color: var(--fg); padding-right: 38px; } .an h2 a { color: inherit; text-decoration: none; } .an .an-d { color: var(--fg3); font-size: 13px; }
.an h3 { margin-top: 8px; color: var(--acc2); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; } .an h4 { margin: 4px 0 0; font-size: 15px; color: var(--fg); }
.an b { color: var(--fg); } .an ul { margin: 0; padding-left: 20px; } .an li + li { margin-top: 4px; }
.an-x { position: sticky; top: 10px; display: block; margin: 10px 10px -42px auto; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--card2); color: var(--fg); z-index: 1; }

/* graphiques */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; max-width: 100%; height: auto; font-family: var(--font); }
.gl { stroke: var(--grid); stroke-width: 1; }
.ytick { fill: var(--fg2); font-size: 11px; font-variant-numeric: tabular-nums; }
.xtick { fill: var(--fg2); font-size: 11px; font-weight: 600; text-anchor: middle; }
.band { fill: #fff; opacity: .09; }
.fut { fill: #fff; opacity: .045; }
.futl { stroke: var(--fg3); stroke-dasharray: 2 3; }
.futt { fill: var(--fg3); font-size: 9.5px; font-weight: 700; letter-spacing: .14em; }
.ev { stroke: #fff; opacity: .4; stroke-dasharray: 2 4; }
.ev.note { opacity: .75; stroke-dasharray: 5 3; }
.evl { fill: var(--fg2); font-size: 10px; font-weight: 600; text-anchor: middle; }
.dot { fill: var(--bg); stroke-width: 2.5; }
.cross { stroke: #fff; opacity: .55; }
.mark { fill: none; stroke: var(--fg2); stroke-width: 1.5; }
.ov { touch-action: pan-y; cursor: crosshair; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: #2C2C2C; border: 1px solid #4A4A4A; border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 150px; max-width: 250px; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); }
.tip b { display: block; margin-bottom: 4px; }
.tr { display: flex; align-items: baseline; gap: 6px; }
.tr i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tr span { color: var(--fg2); flex: 1; min-width: 0; } .tr em { font-style: normal; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.te { margin-top: 4px; color: var(--fg2); }
/* liens vers l'activité Strava */
.tl { color: var(--acc2); font-weight: 700; text-decoration: none; pointer-events: auto; }
.tl:hover, .rn a:hover, a.rn:hover { text-decoration: underline; }
.tip .tl { display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid #4A4A4A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tip .tw { margin-top: 6px; border-top: 1px solid #4A4A4A; }
.tip .tx { position: absolute; top: 0; right: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: none; border: 0; border-radius: 10px; color: var(--fg2); font-size: 15px; pointer-events: auto; cursor: pointer; }
.tip .tx:hover, .tip .tx:active { color: var(--fg); background: rgba(255, 255, 255, .08); } .tip .tx + b { display: block; padding-right: 24px; }
.tip .tpl { color: var(--fg2); } .tip .tpl em { font-style: normal; font-weight: 600; } .tip .tpl span { white-space: nowrap; }   /* séance prévue : une ligne, coupée par « … » */
.tip .tds { margin: 2px 0 2px; font-size: 11.5px; line-height: 1.35; color: var(--fg2); }
.tip .ta { display: flex; gap: 8px; margin: 0; padding: 6px 0 0; border: 0; } .tip .ta span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; } .tip .ta em { font-style: normal; color: var(--fg2); font-weight: 600; }
a.rn, .rn a { color: var(--fg); text-decoration: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend i.ln { height: 3px; width: 14px; background: var(--c); }
.legend i.dash { height: 0; width: 14px; border-top: 2px dashed var(--c); border-radius: 0; }
.legend i.pt { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.legend i.bd { background: #fff; opacity: .22; }
.legend i.mk { width: 8px; height: 8px; border: 1.5px solid var(--fg2); border-radius: 0; transform: rotate(45deg); }
.legend i.evi { width: 0; height: 12px; border-left: 2px dotted #fff; opacity: .6; border-radius: 0; }
i.gh { background: color-mix(in srgb, var(--c) 30%, transparent); border: 1px dashed var(--c); }

/* cartes */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card > p { color: var(--fg); font-size: 15px; }
.brief { display: flex; flex-direction: column; }
.brow { display: grid; grid-template-columns: minmax(104px, 1fr) minmax(56px, 1.1fr) auto; align-items: center; gap: 12px; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; text-align: left; }
.brow:first-child { border-top: 0; }
.bt { font-weight: 600; font-size: 14px; white-space: nowrap; } .bs { min-width: 0; }
.bv { text-align: right; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.bv b { font-size: 16px; font-weight: 800; } .bv .delta { font-size: 11px; font-weight: 600; color: var(--fg2); }
.races { display: flex; flex-direction: column; }
.race { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.race > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; } .race > div:last-child { text-align: right; }
.race:first-child { border-top: 0; }
.rd { color: var(--fg2); font-size: 12px; } .rn { font-weight: 600; overflow-wrap: anywhere; }
.race b { font-variant-numeric: tabular-nums; text-align: right; } .rk, .rp { color: var(--fg2); font-size: 12px; } .rp { text-align: right; }

/* vue Records */
.rtiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rtile { display: flex; flex-direction: column; gap: 1px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; color: var(--fg2); min-width: 0; transition: background .15s, border-color .15s; }
.rtile:hover { border-color: #5a5a5f; }
.rtile .rl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.rtile b { font-size: 25px; font-weight: 800; line-height: 1.2; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rtile .rs { font-size: 12px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rtile.on { background: color-mix(in srgb, var(--mc) 15%, transparent); border-color: var(--mc); box-shadow: 0 0 18px color-mix(in srgb, var(--mc) 22%, transparent); }
.rtile.on b { color: var(--mc); }

":25,"dp":890,"statut":"choisie","note":"Roulant et proche de chez toi · 22 € · repère ≈ 2h30","url":"https://www.athletic-vdn.com/nos-courses/le-trail-des-cuirassiers/","h":"10:00"},{"d":"2027-04-04","nom":"Ekiden de Strasbourg","lieu":"Strasbourg","type":"route","km":10,"statut":"inscrit","note":"Marathon en relais par équipes · mon relais ≤ 10 km (5, 7,2 ou 10 km), équipes fixées début 2027 · sans prépa : séance qualité de la semaine J-7 du Thur"},{"d":"2027-04-11","nom":"Thur Trail « Le Rossberg »","lieu":"Mitzach","type":"trail","km":30,"dp":1100,"statut":"envisagee","note":"Même jour que la Mac VI · repère ≈ 3h00-3h10","h":"09:00","url":"https://www.thur-trail.fr/courses/rossberg"},{"d":"2027-05-16","nom":"Trail des Celtes","lieu":"Barr · Trail Alsace by UTMB","type":"trail","km":47,"dp":1600,"statut":"inscrit","note":"2 running stones · estimation ≈ 4h45","h":"07:00","url":"https://alsace.utmb.world/fr/races/TDC"},{"d":"2027-07-10","est":true,"nom":"Trail du Grand Ballon Summer","lieu":"Le Markstein","type":"trail","km":63,"dp":3100,"statut":"option","note":"Option si CCC · choix en janvier"},{"d":"2027-07-24","est":true,"nom":"MXALPS 66 · Montreux Trail Festival","lieu":"Bex → Montreux","type":"trail","km":66,"dp":4100,"statut":"retenue","note":"Répétition de la CCC, ou objectif d'été sans CCC · choix en janvier"},{"d":"2027-08-27","est":true,"nom":"CCC","lieu":"Courmayeur → Champex → Chamonix","type":"trail","km":101,"dp":6000,"statut":"tirage","obj":"A","note":"Objectif majeur · tirage au sort en janvier (10 stones)","h":"09:00","url":"https://montblanc.utmb.world/fr/races/ccc"}],"notes":{"acts":{"20948675530":"Reprise trois jours après la Wantzenau : FC 115, sous SV1. L'allure baisse un peu en fin de sortie (5'58 à FC 119) : la fatigue de la course est encore là.","20959383119":"Décrassage pur : 97 W, FC 85, cadence 80 tr/min.","20962912814":"Reprise de la barre après trois semaines, charges volontairement légères (10 à 20 kg sous le 23/10) : bonne remise en route avant le Renfo A du 19/11.","20968716981":"Footing à jeun par 2 °C, le lendemain du renfo : FC sous SV1, cadence dans le repère, un peu plus basse sur les 800 derniers mètres (165).","20982442928":"Home-trainer facile bien tenu : FC jamais au-dessus de 128, cadence 87 tr/min. Bonne fin de semaine de récupération.","20997683600":"Footing en famille le dimanche, très tranquille (FC jamais au-dessus de 114) : ne compte pas comme une charge. Bonne façon de bouger un jour de repos.","21007978327":"Seuil de reprise parfaitement réglé sous la pluie et le vent : 7 blocs dans la cible, FC bien plus basse qu'en septembre à allure plus rapide. La forme du 10 km est restée.","21020647328":"Endurance tranquille dans un vent de 23 km/h, au lendemain du seuil : FC 115 de moyenne, jamais au-dessus de 124. Récupération bien gérée.","21034264099":"Rouvy facile avec les nouvelles règles de puissance : longue montée tenue entre 125 et 170 W, FC 104 de moyenne. Seul écart : le mur final à 13 %, à plus de 200 W pendant 3 minutes. Cadence un peu basse en côte (~76).","21046090179":"Sprints francs : de 584 à 675 W, tous au-dessus de la puissance VO2max, pointe à 27 km/h, cadence autour de 200. Récupérations vraiment lentes, comme demandé. Le dernier 15 secondes est le plus rapide, pas écourté : la montre a perdu le signal 4 secondes.","21057965392":"Renfo A de reprise propre : deadlift et squat 5×4 à 90 kg, soit une répétition de plus que prévu mais 10 kg de moins au deadlift. Séance sous-maximale (FC moyenne 95) au lendemain des sprints et après une nuit courte.","21061544797":"Rouvy d'endurance vallonné dans le cadre : 62 min, FC 99 de moyenne, effet d'entraînement 2,0 comme visé. Cadence tenue à 80 et plus dans les rampes, le petit braquet a été appliqué.","21069103077":"SL Active réussie : bloc de 28' fait en entier, du tempo au sweet spot (4:09/km, FC 137), sans dépasser 140 de FC malgré une nuit courte. Cadence qui monte avec l'allure, de 172 à 178.","21097725352":"EF propre et régulière : 8,9 km à 5:35, FC 115 (zone 2 presque tout du long), cadence 170 et rendement aérobie 3,11 pile dans tes repères. Rien à signaler.","21106542258":"Renfo A de la semaine 2 en version allégée : squat 95 kg comme prévu, deadlift 95 au lieu de 105 et une série en moins. Facile (3/10, FC moyenne 102) un jour de variabilité basse ; mollets faits. Rien qui gêne le seuil de demain.","21110216260":"Rouvy d'endurance écourté de moitié (33 min au lieu de 60-65) et très doux : FC 97, effet 1,1, cadence 83 tenue. Ne coûte rien avant le seuil de demain ; raison de la coupure à confirmer.","21119093378":"Six fois 4' à 3'56-3'58 pour une cible à 3'57 malgré 1 °C et le lendemain de renfo : écart de 1,3 % entre blocs, FC 137-141 (max 147), rien à corriger. Séance de seuil la plus régulière du cycle."},"weeks":{"2026-11-09":"Semaine de récupération après le RP de la Wantzenau, hors plan : 4 footings faciles, 2 Rouvy et retour à la barre. Variabilité cardiaque encore basse en fin de semaine. Reprise lundi avec le Seuil 7×3'.","2026-11-16":"Semaine de reprise bien tenue : seuil, endurance de force, sprints, premier Renfo A, Rouvy facile et SL Active complète. Dimanche de repos pour faire remonter la VFC, puis EF 30' lundi.","2026-11-23":"Semaine bien lancée : EF lundi, Renfo A allégé mardi, et le Seuil 6×4' de mercredi réussi au métronome. Reste EF jeudi, endurance de force vendredi et SL 1h30 samedi."},"nuits":{"2026-11-19":"Nuit correcte (coucher 23h30), sommeil profond abondant mais paradoxal très court, à relativiser avec la montre desserrée ; besoin de sommeil relevé à 8h40 : vise un coucher vers 22h45 ce soir.","2026-11-20":"Coucher à minuit et 7h00 de sommeil pour un besoin de 8h40 : nuit peu récupératrice, stress nocturne en hausse et recharge faible. Paradoxal encore court, à relativiser avec la montre desserrée.","2026-11-21":"Coucher 23h36 et 7h38 de sommeil : plus long qu'hier, avec beaucoup de profond (1h43), mais encore 1h10 sous ton besoin. Stress nocturne en baisse, recharge toujours modeste (30). Paradoxal à 0 : à ignorer, montre desserrée.","2026-11-22":"Coucher 0h11 et 8h47 de sommeil pour un besoin de 8h40 : nuit la plus longue de la semaine, avec 1h51 de profond. Stress nocturne en baisse (23) et recharge de 51, la meilleure depuis plusieurs nuits. Paradoxal à relativiser, montre desserrée.","2026-11-23":"Coucher 23h55 et 6h56 de sommeil pour un besoin de 8h10 : environ 1h15 de moins que ton besoin, après la plus longue nuit de la semaine. Stress nocturne bas (19), recharge de 48 et un seul réveil. Paradoxal court, à relativiser, montre desserrée.","2026-11-24":"Coucher 23h17 et 7h29 de sommeil pour un besoin de 7h50 : 20 min de moins, avec un bon profond (1h59). Stress nocturne en hausse (31) et recharge faible (31) : la détente n'a pas suivi. Paradoxal à relativiser, montre desserrée.","2026-11-25":"Coucher 22h59 et 7h48 de sommeil pour un besoin de 7h50 : le besoin est couvert, meilleur score de la semaine (77). Stress nocturne un peu plus bas (26) et recharge de 40, encore modeste. Paradoxal à relativiser, montre desserrée."},"vfc":{"2026-11-19":"Retombée sous ta zone habituelle après deux nuits dedans : la reprise du plan (seuil lundi, Rouvy hier) se fait sentir. Rien d'alarmant tant qu'elle remonte d'ici deux ou trois nuits.","2026-11-20":"Deuxième nuit sous ta zone habituelle (43-53), avec une FC de repos à 53 : la semaine de reprise pèse encore. Rien d'alarmant sur deux nuits ; à surveiller si elle ne remonte pas après le repos de dimanche.","2026-11-21":"VFC à 41, encore sous ta zone habituelle (43-53) pour la troisième nuit, mais en légère remontée sur hier (37) et égale à ta moyenne sur 7 jours. FC de repos à 52. Pas de tendance inquiétante : la semaine de reprise se paie, le repos de dimanche arrive.","2026-11-22":"VFC à 44, de retour dans ta zone habituelle (43-53) après trois nuits dessous, et moyenne 7 jours en remontée (42). FC de repos à 51. Une nuit ne fait pas une tendance, mais le repos de dimanche a servi.","2026-11-23":"VFC à 50, bien dans ta zone habituelle (43-53) et en hausse sur hier (44) ; moyenne 7 jours à 43. FC de repos à 50. Deux nuits de suite dans ou près de la zone : la semaine de reprise est encaissée.","2026-11-24":"VFC à 41, repassée sous ta zone habituelle (44-53) après 50 hier ; moyenne 7 jours stable à 43. FC de repos à 52. Une nuit basse ne fait pas une tendance : à surveiller avant le seuil de demain.","2026-11-25":"VFC à 41 pour la 2e nuit de suite, sous ta zone habituelle (43-53) ; moyenne 7 jours à 42. FC de repos à 51, indice de préparation à 39. Sommeil correct mais récupération en retrait : à garder en tête pour le seuil du jour."}},"analyses":{"21046090179":"# Endurance de force 2x(35\"/25\"/15\") 🏎️ — jeudi 19/11/2026\n\n## Verdict\nSéance de sprints réussie : six sprints francs entre 22 et 23 km/h de moyenne, second bloc au niveau du premier. Point marquant : le dernier 15 secondes est le plus rapide de la séance, pas un sprint écourté comme le laissait croire la montre.\n\n## Exécution\n- **Prévu / réalisé** : 54 min et 9,5 km sur Nolio, 55'48 et 9,8 km réalisés. Conforme.\n- **Sprints** : 217 / 156 / 94 m puis 216 / 156 / 96 m. Puissance de 584 à 675 W ; le 35 secondes du bloc 2, seul sprint face au vent, est le plus puissant.\n- **Dernier 15 secondes** : la montre a perdu puissance et cadence pendant 4 secondes, d'où sa moyenne basse (385 W). La vitesse n'a pas faibli, et tu as prolongé jusqu'à 27 km/h.\n- **Récupérations** : 3 minutes très lentes, FC revenue à 120 avant chaque départ, pic à 155. Entre les blocs, 3 minutes au lieu des 5 de Campus (à confirmer), sans effet visible.\n- **Cadence** : 198 à 206 pas/min en sprint, contact au sol 185 à 196 ms : tes repères hauts. Échauffement à 169, comme d'habitude.\n\n## Contexte\n- Nuit de 7h22, variabilité cardiaque à 39 pour 42 de moyenne sur 7 jours : sous ta zone, sans effet sur l'explosivité. Indice de préparation 50 au réveil.\n- Capacité aérobie max Garmin : 56,3 (56,5 mardi). Des sprints courts la renseignent peu, à relire après la sortie longue de samedi.\n\n## Pour la suite\n- Rien à changer au plan. Proposition : 5 minutes entre les blocs sur la montre pour la prochaine endurance de force.\n- Le Renfo A apparaît vendredi midi sur Nolio, veille de la sortie longue (déplacement à confirmer) : reste aux charges de reprise et garde le Rouvy vraiment facile.\n- Nutrition : laitage protéiné ce soir au coucher ; demain, 30 à 35 g de protéines dans l'heure qui suit le renfo.\n","21057965392":"# Renfo 🏋🏼 — vendredi 20/11/2026\n\n## Verdict\nPremier vrai Renfo A de la reprise, fait proprement : deadlift et squat à 90 kg en 5 séries de 4, sans accroc. Tu as pris un peu plus de répétitions et un peu moins de charge au deadlift que prévu : séance sous-maximale, parfaite pour relancer la barre.\n\n## Exécution\n- **Prévu sur Nolio** : demi-squat 5×3 à 90 kg, deadlift 5×3 à 100 kg, bloc mollets debout, récupération 2'.\n- **Réalisé** : deadlift 5×4 à 90 kg, squat 5×4 à 90 kg, dead bug 4×20 avec 2,5 kg, planche dynamique 4×1', récupération 2'. Soit 20 répétitions par mouvement au lieu de 15, mais 10 kg de moins au deadlift. Bloc mollets : non noté, à confirmer.\n- **Cœur** : FC moyenne 95, pic à 139 (le pic de la prise de barre est à relativiser, montre au poignet). Presque tout le temps en zone 1, 46 secondes en zone 3.\n- **Montre** : charge 62, effet surtout anaérobie (2,3 contre 1,7 en aérobie), durée 43'44. Cadence sans objet ici.\n\n## Contexte\n- Nuit courte et agitée : couché vers minuit, 7h00 de sommeil, profond 60', variabilité cardiaque à 37 (zone habituelle 43-53), FC de repos 53, recharge faible. Indice de préparation à 15, statut d'entraînement « tendu » (rapport de charge 1,1).\n- La veille : sprints d'endurance de force, charge 207. Deux jours de suite sur les jambes, d'où la sagesse des 90 kg.\n- Capacité aérobie max Garmin : 56,3, inchangée depuis hier.\n\n## Pour la suite\n- Le plan prévoit 95 kg au squat et 105 kg au deadlift jeudi 26/11 : à décider au réveil selon la nuit. Si la variabilité remonte vers 43, on monte ; sinon on reste à 90-100.\n- Le Rouvy vallonné de ce soir reste facile (cadence 80 ou plus, FC sous 115). Les cuisses peuvent tirer un peu pour la sortie longue de demain : démarre-la en souplesse.\n- Nutrition : demain, sortie active de 1h25, un gel de secours en poche et un vrai repas dans les deux heures après.\n","21061544797":"# ROUVY - Alnif | Morocco — vendredi 20/11/2026\n\n## Verdict\nRouvy d'endurance vallonné **propre et dans le cadre** : 62 min, 29 km, 265 m de D+, FC 99 de moyenne, effort ressenti 2/10. Séance facile qui ne coûte rien avant la sortie longue de demain.\n\n## Exécution\n- **Prévu sur Nolio** : palier 1 d'Alnif, 58-64 min, FC ≤ 115, cadence ≥ 80, effet d'entraînement 2,0-2,3. **Réalisé** : 62 min, effet **2,0** : pile dans la cible.\n- **Puissance** : 116 W de moyenne (135 W de puissance normalisée), sous les ~140 W visés mais dans ta fourchette habituelle de Rouvy facile (120-145 W à FC 95-105). Les pointes (345 W sur 5 s, 500 W au maximum) sont des raidillons passés d'un coup de pédale : ça fait quelques secondes au-dessus de la règle des 180 W, rien de plus.\n- **Fréquence cardiaque** : 99 de moyenne, 121 au maximum. Le plafond de 120 est touché une fois, brièvement, dans une rampe vers 4-5 %, sans y rester plusieurs minutes. Le reste du temps, 94-110.\n- **Cadence** : 83 tr/min de moyenne, planchers de 80 respectés dans les rampes (autour de 80-85 à 4-6 %), contre ~76 le 18/11 : **le petit braquet en côte a été appliqué**. Pointes à 90-100 en descente.\n\n## Contexte\n- Nuit courte (coucher à minuit, 7h de sommeil, score 62), variabilité cardiaque moyenne sur 7 jours à 41 : indice de préparation bas toute la journée (13 ce soir), cohérent avec une séance volontairement très douce.\n- FC de repos 53 (moyenne 7 jours 51), statut d'entraînement Garmin « sous tension », rapport de charge 1,1 : la semaine est chargée (seuil, endurance de force, renfo, sprints), c'est voulu.\n- Capacité aérobie max Garmin : **56,3** (relevé du 19/11, le vélo virtuel ne la fait pas bouger).\n\n## Pour la suite\n- Demain, SL Active 1h25 (clé de la semaine) : **le bloc actif de 28 minutes reste facultatif**, à décider au ressenti après l'échauffement ; l'endurance de 45 minutes passe dans tous les cas.\n- **Rappel nutrition pour demain** : gel de secours en poche, vrai repas dans les 2 heures après la sortie. Coucher vers 22h30 ce soir pour compenser la nuit courte.\n","21069103077":"# Endurance 40' + 28' Progressives — samedi 21/11/2026\n\n## Verdict\nSL Active **réussie et bien dosée** : échauffement facile, bloc actif de 28 minutes fait en entier (10' d'endurance active, 15' de tempo, 3' de sweet spot) et retour au calme. Le point marquant : tout est monté marche par marche, sans jamais dépasser 140 de FC, alors que la nuit était courte.\n\n## Exécution\n- **Prévu sur Nolio** : 45' d'endurance, bloc actif facultatif de 28', 12' d'endurance, soit 1h25 et 16,5 km. **Réalisé** : 40' + 28' + 8', soit 1h16 et 15,3 km. Écart de 9 minutes, dans l'esprit du « ne pas chercher à tirer jusqu'à 1h30 ».\n- **Échauffement** : 7,7 km à 5:11/km, FC de 110 à 123 en montant doucement. Dans la cible d'endurance.\n- **Bloc actif** : endurance active vers 4:52/km (FC 128), tempo vers 4:37/km (FC 129-130, 405-415 W, pile dans tes repères du tempo), puis **sweet spot à 4:09/km** sur 3' (FC 137, maximum 140, 459 W). Aucune dérive, la FC reste en zone 2-3 haute.\n- **Cadence** : 173 pas/min en moyenne. Elle monte avec l'allure : environ 172 à l'échauffement, 175 au tempo, 178 sur le sweet spot. Régulière et sans trou.\n- **Rendement aérobie** : 392 W de puissance normalisée pour 124 de FC, soit 3,16 : dans ta médiane de footings (3,12). Régularité d'effort 1,01.\n\n## Contexte\n- Nuit du 20 au 21 : 7h38 de sommeil, variabilité cardiaque 41 (moyenne 7 jours 41), FC de repos 52, indice de préparation 15 au réveil puis 1 après la séance. Les chiffres bas n'ont pas empêché une séance propre, comme prévu pour du foncier.\n- Statut d'entraînement Garmin « sous tension », rapport de charge 1,3 : la semaine de reprise est chargée, c'est voulu. Effet d'entraînement 3,9 (base aérobie), charge 163.\n- Capacité aérobie max Garmin : **56** (56,2, stable).\n\n## Pour la suite\n- La séance valide la reprise : endurance de force, sprints, renfo et SL Active passés dans la même semaine. Demain, **dimanche de repos** : c'est lui qui doit faire remonter la variabilité cardiaque. Lundi, EF 30'.\n- **Rappel nutrition** : rien de spécial demain. Aujourd'hui, un vrai repas dans les 2 heures qui suivent la sortie ; coucher vers 22h45 ce soir.\n","21097725352":"# Endurance 50' 🔦🥶 — lundi 23/11/2026\n\n## Verdict\nFooting d'endurance propre, joué à la lettre : allure facile, FC sous 128 presque tout du long, cadence en plein dans tes repères. Séance de fond sans histoire, qui entretient la base pour la suite de la semaine.\n\n## Exécution\n- **Prévu Nolio : EF 45' (8,3 km)**, réalisé 49'51 pour 8,9 km, D+ 75 m : +7 %, écart mineur, conforme ✅.\n- **Allure 5:35/km moyenne**, de 5:20 à 6:00 selon le profil (premier km à 6:00, départ prudent). FC moyenne **115**, maximale 131 en haut d'une côte du km 4 (pic bref, sous la zone d'alerte). **Zone 2 pendant 37 minutes sur 50.**\n- **Puissance 354 W** (normalisée 358, régularité 1,01) ; rendement aérobie **3,11**, pile sur la médiane de tes footings (3,12).\n- **Cadence 170** (173 au début, 168-170 ensuite), contact au sol 266 ms, foulée 1,05 m : repères EF (169 / 270 ms) tenus, aucune dérive.\n- Petite montée de FC à allure égale : 111 sur le plat du km 3 (5:20), 116 sur ceux des km 5 et 7 (5:22-5:24), soit +5 bpm sur 50' : normal pour la durée.\n\n## Contexte\n- Nuit 22→23 : 6h56, VFC 50 dans ta zone, FC de repos 50. Indice de préparation 51 le matin, 38 après la séance : sans importance sur une EF.\n- **Capacité aérobie max 55,9** (56,0 le 21/11) : glissade lente liée à la FC max réglée à 160, peu d'information sur un footing à FC basse. Statut « maintien », rapport de charge 1,1, effet d'entraînement 3,0 (base aérobie), charge 73.\n\n## Pour la suite\n- Rien à changer : mardi Rouvy d'endurance + Renfo A, mercredi Seuil 6×4' (10,7 km). La VFC dans la zone te laisse aborder la semaine sereinement.\n- **Rappel nutrition :** demain rien de spécial (petit-déjeuner protéiné avant si le renfo est le matin). Pour le seuil de mercredi, 15 à 25 g de glucides 30 à 60' avant si le dernier repas date de plus de 3 h.\n","21106542258":"# Renfo 🏋🏼 — mardi 24/11/2026\n\n## Verdict\nRenfo A de la semaine 2 fait en version allégée : squat à 95 kg comme prévu, deadlift à 95 kg au lieu de 105, et une série de moins sur chaque mouvement lourd. Séance courte, propre et bien dosée un jour de variabilité cardiaque basse : elle entretient la barre sans rien coûter à la séance de seuil de demain.\n\n## Exécution\n- **Prévu sur Nolio** : demi-squat 5×3 à 95 kg, deadlift 5×3 à 105 kg, bloc mollets debout, récupération 2'.\n- **Réalisé** : squat 4×3 à 95 kg, deadlift 4×4 à 95 kg, mollets 4×10 à 95 kg, dead bug 4×20 avec 2,5 kg, planche dynamique 4×1'. Le squat monte de 5 kg par rapport au 20/11, le deadlift aussi ; mais le volume baisse (12 et 16 répétitions contre 20 chacun le 20/11). Le bloc mollets est fait cette fois.\n- **Ressenti** : 3 sur 10, séance facile. Si la baisse de charge au deadlift et la série en moins sont voulues (nuit, seuil demain) : à confirmer.\n- **Cœur** : FC moyenne 102, pic à 140 (prise de barre, à relativiser avec la montre au poignet). Surtout zone 1 (11'23), 7'41 en zone 2 et 1'28 en zone 3.\n- **Montre** : 30'52, charge 78, effet 2,0 en aérobie et 2,5 en anaérobie, réserves d'énergie −3. Cadence sans objet.\n\n## Contexte\n- Nuit du 23 au 24 : 7h29 de sommeil, profond 1h59, mais stress nocturne en hausse et recharge faible ; variabilité cardiaque 41 (zone habituelle 44-53), FC de repos 52. Indice de préparation 41 le matin, 22 après la séance (baisse normale après un effort).\n- Statut d'entraînement « maintien », rapport de charge 1,1 : la charge reste dans la zone cible. Pas de séance de sprints la veille : rien à signaler sur l'enchaînement.\n- Capacité aérobie max Garmin : 55,9, inchangée.\n\n## Pour la suite\n- Demain, Seuil 6×4' : seule séance à surveiller. Si la variabilité cardiaque reste sous 44 au réveil, le dire avant de partir plutôt que de forcer.\n- Renfo A suivant (semaine 3, 03/12) prévu à 100 kg au squat et 110 au deadlift : proposition, le deadlift à 100 kg d'abord si la nuit est mauvaise ; on reprend la montée à 105-110 dès que la variabilité est revenue dans ta zone.\n- Nutrition : demain, seuil de 53' ; 15 à 25 g de glucides 30 à 60 minutes avant si ton dernier repas date de plus de 3 h, et un vrai repas dans l'heure et demie qui suit.\n","21110216260":"# ROUVY - Cap Corse West | Corsica — mardi 24/11/2026\n\n## Verdict\nRouvy d'endurance **coupé de moitié et très doux** : 33 min, 15,8 km, FC 97 de moyenne, effet d'entraînement 1,1 (récupération). Pas la séance prévue sur le papier, mais elle ne coûte rien et laisse les jambes libres pour le seuil de demain.\n\n## Exécution\n- **Prévu sur Nolio** : palier 2 (Bow Lake, 25 km, 60-65 min, ~145-150 W, FC ≤ 115, effet 2,0-2,3). **Réalisé** : un autre parcours, 33 min, 112 W de moyenne (125 W de puissance normalisée), effet 1,1 : environ la moitié de la durée et ~30 W sous la cible. Raison de ce choix **à confirmer** (la séance est venue 5 h après le Renfo A).\n- **Fréquence cardiaque** : 97 de moyenne, 109 au maximum, 30 min sur 33 en zone 1 : très loin du plafond de 120.\n- **Puissance** : pointes à 327 W sur quelques secondes (raidillons), 267 W sur 5 s ; le reste est calme, 117 W sur 20 min.\n- **Cadence** : 83 tr/min de moyenne (99 au maximum), plancher de 80 respecté, y compris dans la longue montée de 18 min (80 en moyenne). Le petit braquet en côte est bien acquis.\n\n## Contexte\n- Nuit 23→24 : 7h29, score 61, VFC 41 sous ta zon   const vs = P.map(v.val), x0 = Math.floor(Math.min(...P.map(r => r.y))), x1 = Math.floor(Math.max(...P.map(r => r.y))) + 1;

  const X = t => ml + (t - x0) / (x1 - x0) * pw, f = n => n.toFixed(1);
  const Y = val => v.inv ? mt + 8 + (val - lo) / (hi - lo) * (ph - 8) : mt + ph - (val - lo) / (hi - lo) * (ph - 8);   // classement : mieux classé = plus haut
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${v.l} de chaque trail au fil des années">`;
  // dégradé vertical lié à la valeur : froid en bas, chaud en haut (plus long / mieux classé)
  s += `<defs><linearGradient id="tgl" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${mt + ph}" y2="${mt}"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".5" stop-color="#3FA7F5"/><stop offset="1" stop-color="#FC5200"/></linearGradient>`
    + `<linearGradient id="tga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FC5200" stop-opacity=".32"/><stop offset=".55" stop-color="#3FA7F5" stop-opacity=".1"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient></defs>`;
  for (let y = x0; y < x1; y += 2) s += `<rect class="tyb" x="${f(X(y))}" y="${mt}" width="${f(X(y + 1) - X(y))}" height="${ph}"/>`;   // une année sur deux légèrement teintée
  for (let g = lo; g <= hi + 1e-9; g += st) if (!(v.inv && g === 0)) s += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${f(Y(g))}" y2="${f(Y(g))}"/><text class="ytick" x="${W - mr + 8}" y="${f(Y(g) + 4)}">${v.ax(g)}</text>`;
  for (let y = x0; y < x1; y++) s += `<text class="xtick" x="${f(X(y + .5))}" y="${H - 6}">${y}</text>`;

  // moyenne
  const avg = sum(vs) / vs.length, ya = Y(avg);

  const avgT = `<text class="tavl" x="${ml + 2}" y="${f(ya - 5)}">moy. ${v.ax(v.id === 'rk' ? Math.round(avg * 100) / 100 : Math.round(avg))}</text>`;   // posé après les points pour rester lisible
  s += `<polyline fill="none" stroke="url(#tgl)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts.join(' ')}"/>`;

  [...best, ...(best.includes(last) ? [] : [last])].forEach(r => {
    const t = (best.includes(r) ? (v.inv ? '🏅 ' : '★ ') : '') + tShort(r), w = t.length * 6 + 8, px = X(r.y), py = Y(v.val(r));
    const cx = Math.min(W - mr - w / 2, Math.max(ml + w / 2, px));

    }

  const tip = el('div', 'tip'); tip.hidden = true; box.appendChild(tip);
  const svg = box.querySelector('svg');

    const r = TT[+g.dataset.i], show = () => {

}

/* une épreuve courue plusieurs fois : chaque édition, écart de chrono quand le parcours est le même */
const repH = g => `<div class="trep"><h3>${esc(g[g.length - 1].ev)}<span class="muted"> · ${g.length} participations</span></h3>${g.map((r, i) => {

}).join('')}</div>`;

/* vitesse verticale (m/h) par tranche de pente de 5 %, une courbe par année (D.vert = {année: {"+15": [D, s, sorties]}}) */
const VB = [-30, -25, -20, -15, -10, -5, 5, 10, 15, 20, 25, 30], VCOL = ['#2DD4BF', '#3FA7F5', '#FC5200'];

function drawVert(box, YS) {

    [P.filter(p => p[1] < 0), P.filter(p => p[1] > 0)].forEach(Q => { if (Q.length > 1) s += `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${Q.map(p => f(X(p[0])) + ',' + f(Y(p[2]))).join(' ')}"/>`; });
    P.forEach(([i, b, v]) => { const o = D.vert[y][vKey(b)];

const vertH = YS => { const y = YS[YS.length - 1], p = YS[YS.length - 2], up = vVal(y, 15), dn_ = vVal(y, -15), d = (a, b) => a != null && b != null ? ` <span class="${a >= b ? 'gain' : 'loss'}">${a >= b ? '▲' : '▼'} ${nf(Math.abs(a / b - 1) * 100)} % vs ${p}</span>` : '';

function renderTrails(app) {

/* ---------- vue Indicateur : dernière séance (selon l'indicateur choisi) et semaine en cours, trois lignes chacune ----------
   Le commentaire vient des analyses de séance (notes.json, rempli à chaque analyse) ; à défaut il est calculé sur les données. */
const NOTES = Object.assign({ acts: {}, weeks: {}, nuits: {}, vfc: {} }, D.notes || {});
const TEFR = { RECOVERY: 'récupération', AEROBIC_BASE: 'endurance de base', TEMPO: 'tempo', LACTATE_THRESHOLD: 'seuil', VO2MAX: 'VO2max', ANAEROBIC_CAPACITY: 'anaérobie' };
const RUNS = ['run', 'trail'], BIKES = ['route', 'vtt', 'home', 'velotaf'];
const LIFT = { sq: 'Squat', dl: 'Deadlift', bp: 'Développé couché' };
const isoOf = x => toDate(x).toISOString().slice(0, 10);
const fmtMn = mn => mn >= 60 ? fmtH(mn / 60) : Math.round(mn) + ' min';
const SEANCE = {   // indicateur -> quelle séance afficher
  run: a => RUNS.includes(a.t),
  velo: a => BIKES.includes(a.t), renfo: a => a.t === 'renfo', heures: () => true, charge: a => a.ld != null };

const MNOTE = { sl: 'nuits', hrv: 'vfc' };   // analyse écrite de la dernière nuit (notes.json, clé = date du réveil)

function actFacts(a) {
  const run = RUNS.includes(a.t), p = [];
  if (a.t === 'renfo') { const l = D.lifts.find(l => l.d === a.d); if (l) return Object.keys(LIFT).filter(k => l[k]).map(k => `${LIFT[k]} ${l[k].lab}`).join(' · '); }
  if (a.km >= .5) p.push(nf(a.km, 1) + ' km');
  p.push(fmtMn(a.mn));
  if (run && a.km) p.push(fmtPace(a.mn / a.km) + '/km');
  if (a.dp > 150) p.push(nf(a.dp) + ' m D+');

}
function actAuto(a) {
  const b = [];

  if (RUNS.includes(a.t) && a.km > 3 && a.hr && !a.race) {   // FC comparée aux sorties récentes à la même allure (± 20 s/km)
    const pace = a.mn / a.km, sim = D.acts.filter(o => o !== a && RUNS.includes(o.t) && o.hr && o.km > 3 && !o.race && o.x < a.x && o.x >= a.x - 90 && Math.abs(o.mn / o.km - pace) < .34);
    if (sim.length >= 4) { const d = Math.round(a.hr - med(sim.map(o => o.hr))); b.push(Math.abs(d) < 3 ? 'FC habituelle à cette allure' : `FC ${Math.abs(d)} bpm ${d < 0 ? 'sous' : 'au-dessus de'} tes sorties à cette allure`); }
  }
  if (a.cad && ['RECOVERY', 'AEROBIC_BASE'].includes(a.te)) b.push(a.cad < 165 ? 'cadence basse (repère 169)' : a.cad > 175 ? 'cadence haute (repère 169)' : 'cadence dans ton repère');
  if (a.ld) b.push('charge ' + a.ld);
  return b.join(', ');
}
// replié sur trois lignes : titre, chiffres clés, commentaire ; le reste (extra) se lit en touchant la ligne
const bline = (ico_, title, facts, cmt, extra, an, cls) => `<p class="bl${cls ? ' ' + cls : ''}"${an ? ` data-an="${an}"` : ''} role="button" tabindex="0" title="${an ? "Toucher pour lire l'analyse" : 'Toucher pour tout lire'}">${ico(ico_)}<b>${title}</b>${facts ? ' · ' + facts : ''}${cmt ? ' — ' + cmt : ''}${extra ? ` <span class="bx">(${extra})</span>` : ''}</p>`;

function seanceH(m) {
  if (MESURE[m.id]) return mesureH(m);
  const a = [...D.acts].reverse().find(SEANCE[m.id] || SEANCE.heures); if (!a) return '';
  const t = `${esc(a.n)} <span class="bd">${fmtDJ(a.x).replace(/ \d{4}$/, '')}</span>`, note = NOTES.acts[a.id];
  const an = AN[a.id] ? a.id : '';
  return note ? bline(m.ico, t, '', esc(note), esc(actFacts(a)), an) : bline(m.ico, t, esc(actFacts(a)), esc(actAuto(a)), '', an);   // analyse écrite d'abord, chiffres ensuite
}
// analyse complète d'une séance (analyses/<id Strava>.md, embarquée au build) : s'ouvre dans une fenêtre au clic sur la ligne.
// Mise en forme reconnue : titres #, listes à tirets, **gras** ; le titre de tête du fichier est remplacé par celui de la séance.
const AN = D.analyses || {};
function mdH(md) {
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); let h = '', ul = false;
  for (const l of md.replace(/^\s*# .*\r?\n/, '').split(/\r?\n/)) {
    const li = /^\s*[-*] (.*)/.exec(l), hd = /^(#{1,3}) (.*)/.exec(l);
    if (ul && !li) { h += '</ul>'; ul = false; }
    if (li) { h += (ul ? '' : '<ul>') + `<li>${inl(li[1])}</li>`; ul = true; }
    else if (hd) h += `<h${hd[1].length + 1}>${inl(hd[2])}</h${hd[1].length + 1}>`;
    else if (l.trim()) h += `<p>${inl(l)}</p>`;
  }
  return h + (ul ? '</ul>' : '');
}
function showAnalyse(id) {
  const a = D.acts.find(a => a.id === id); if (!a || !AN[id]) return;
  let d = document.getElementById('an-dlg');
  if (!d) { d = document.createElement('dialog'); d.id = 'an-dlg'; document.body.appendChild(d); d.addEventListener('click', e => { if (e.target === d || e.target.closest('.an-x')) d.close(); }); }
  d.innerHTML = `<button class="an-x" aria-label="Fermer">✕</button><div class="an"><h2><a href="${STRAVA}${a.id}" target="_blank" rel="noopener">${esc(a.n)}</a></h2><p class="an-d">${fmtDJ(a.x)} · ${esc(actFacts(a))}</p>${mdH(AN[id])}</div>`;
  d.showModal(); d.scrollTop = 0;
}
function mesureH(m) {

function drawAgenda(box) {   // frise des mois à venir : un point par course (taille = km-effort, couleur = route / trail), nom de la course au-dessus ou en dessous

      if (!used.some(([u, v]) => a < v + 8 && a + w > u - 8)) { (lanes[id] = used).push([a, a + w]); return { r, t, a, w, xc, id }; } } });

/* ---------- vue Indicateur « Allures » : courbe allure ↔ FC, zones et repères (Garmin, Campus Coach, chronos, calculs) ----------
   Repères figés au 18/11/2026 : à mettre à jour quand Campus Coach change ses allures, après un nouveau RP ou un nouveau seuil Garmin. */
const AL = {
  maj: '2026-11-18', vma: 18.5, fcmax: 160, fcr: 50,
  // FC en effort continu selon l'allure (min/km) : sorties et courses de 2026 (EF, tempo, semi, 10 km, 5 km, 1500 m)
  pts: [[6.5, 101], [5.73, 112], [4.77, 126], [4.07, 142], [3.80, 148.5], [3.68, 152], [3.38, 159], [3.1, 160.5]],
  // zones FC Garmin (% FC max 160), planchers
  zones: [['Z1', 'Récupération', 96, '#8C8C8C', 'Récup'], ['Z2', 'Endurance fondamentale', 112, '#4FA3FF', 'EF'], ['Z3', 'Tempo', 128, '#4CD97B', 'Tempo'], ['Z4', 'Seuil', 141, '#FFB347', 'Seuil'], ['Z5', 'VO2max', 152, '#FF6B6B', 'VO2max']],

  rep: [
    ['VMA', 195, '158-160', 'Calcul', 'D’après le test 1500 m (5\'04) : vitesse tenable 5 à 6 minutes.', 'VMA'],
    ['1500 m (RP)', 203, 'max 159', 'Course', 'Test du 27/03/2026 en 5\'04.'],
    ['Allure 5 km', [219, 221], '149-156', 'Course', 'RP 18\'25 ; allure AS5 de Campus 3\'40.', '5 km'],
    ['Seuil 30', 223, '152-158', 'Campus', 'Allure tenable environ 30 minutes, en fractionné.'],
    ['Seuil lactique (SV2)', 226, '153', 'Garmin', 'Estimation de la montre (25/09/2026).'],
    ['Vitesse critique', [226, 229], '', 'Calcul', 'Modèle distance-temps sur 1500 m et 5 km : limite haute de l’effort stable.'],
    ['Allure 10 km', [228, 231], '148', 'Course', 'RP 38\'03 (3\'48) ; allure AS10 de Campus 3\'49-3\'51.', '10 km'],
    ['Seuil 60', 237, '≈ 145', 'Campus', 'Allure tenable environ 1 heure ; 134-139 en 7×3\' le 16/11.', 'Seuil 60'],
    ['Allure semi', [239, 244], '142', 'Campus', 'Allure AS21 de Campus 3\'59 ; RP 1h25\'53 à 4\'04.', 'Semi'],
    ['Sweet spot', [252, 255], '', 'Campus', 'Juste sous le seuil 60, dans les séances « S60 alternative ».'],
    ['Seuil aérobie (SV1)', [280, 285], '128-134', 'Calcul', 'Estimé : 85-88 % de la FC au seuil lactique ; tempo à 4\'46 tenu 25\' sans dérive à FC 126-127.'],
    ['Tempo', 285, '≈ 126', 'Campus', 'Blocs actifs des sorties longues.', 'Tempo'],
    ['Endurance fondamentale', [320, 350], '107-118', 'Campus', 'Plafond Campus FC 128 ; repère cadence 169.', 'EF'],
    ['Récupération', [360, 400], '< 112', 'Garmin', 'Footings très lents, retours au calme.']
  ]
};
const SRC_COL = { Garmin: '#4FA3FF', Campus: '#FFB347', Course: '#FC5200', Calcul: '#BDBDBD' };
const fmtS = s => Math.floor(s / 60) + '\'' + String(Math.round(s % 60)).padStart(2, '0');
const kmh = s => 3600 / s;
// FC selon la vitesse : interpolation monotone (Fritsch-Carlson) entre les points mesurés
const AL_F = (() => {
  const P = AL.pts.map(([p, f]) => [60 / p, f]).sort((a, b) => a[0] - b[0]), n = P.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((P[i + 1][1] - P[i][1]) / (P[i + 1][0] - P[i][0]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : 2 / (1 / d[i - 1] + 1 / d[i]);
  return v => { if (v <= P[0][0]) return P[0][1] + m[0] * (v - P[0][0]); if (v >= P[n - 1][0]) return P[n - 1][1] + m[n - 1] * (v - P[n - 1][0]);
    let i = 0; while (v > P[i + 1][0]) i++; const h = P[i + 1][0] - P[i][0], t = (v - P[i][0]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * P[i][1] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * P[i + 1][1] + (t3 - t2) * h * m[i + 1]; };
})();
const AL_V = fc => { let a = 6, b = 20; for (let k = 0; k < 40; k++) { const c = (a + b) / 2; AL_F(c) < fc ? a = c : b = c; } return (a + b) / 2; };   // vitesse pour une FC
const repS = r => Array.isArray(r[1]) ? (r[1][0] + r[1][1]) / 2 : r[1];
const repA = r => Array.isArray(r[1]) ? `${fmtS(r[1][0])}-${fmtS(r[1][1])}` : fmtS(r[1]);
const zoneOf = fc => { let z = AL.zones[0]; for (const q of AL.zones) if (fc >= q[2]) z = q; return z; };

// échelle verticale des allures (rapide en haut), zones en couleur sur la barre ; les repères sont espacés régulièrement
// à droite et reliés par un trait à leur vraie place sur l'échelle : plus aucun chevauchement
function alLadder(host) {
  const W = Math.max(host.clientWidth, 280), L = AL.rep.map((r, i) => ({ r, i, v: kmh(repS(r)) })).sort((a, b) => b.v - a.v);
  const rh = 38, mt = 12, H = mt * 2 + rh * L.length, bx = 40, bw = 24, lx = 90, vTop = 19, vBot = 9.2;
  const Y = v => mt + rh / 2 + (vTop - v) / (vTop - vBot) * (H - 2 * mt - rh);
  const zb = AL.zones.map((z, i) => { const vLo = i ? AL_V(z[2]) : vBot, vHi = i < AL.zones.length - 1 ? AL_V(AL.zones[i + 1][2]) : vTop;
    return `<rect x="${bx}" y="${Y(vHi)}" width="${bw}" height="${Y(vLo) - Y(vHi)}" fill="${z[3]}" opacity=".9" rx="3" stroke="var(--card)" stroke-width="1.5"/><text class="alz" x="${bx + bw / 2}" y="${(Y(vHi) + Y(vLo)) / 2 + 4}" text-anchor="middle" fill="#111">${z[0]}</text>`; }).join('');
  const tk = [180, 210, 240, 270, 300, 360].map(s => `<line class="gl" x1="${bx - 5}" x2="${bx}" y1="${Y(kmh(s))}" y2="${Y(kmh(s))}"/><text class="ax" x="${bx - 8}" y="${Y(kmh(s)) + 4}" text-anchor="end">${fmtS(s)}</text>`).join('');
  const rows = L.map((o, k) => { const { r, i } = o, y = mt + rh * k + rh / 2, c = SRC_COL[r[3]], fc = r[2] || '≈ ' + nf(AL_F(o.v));
    const ty = Array.isArray(r[1]) ? [Y(kmh(r[1][1])), Y(kmh(r[1][0]))] : null, py = Y(o.v);
    return `<g class="alp" data-i="${i}">${ty ? `<line class="alrg" x1="${bx + bw + 4}" x2="${bx + bw + 4}" y1="${ty[0]}" y2="${ty[1]}" stroke="${c}"/>` : ''}
      <path class="alld" d="M${bx + bw + 4},${py} C${lx - 14},${py} ${lx - 22},${y} ${lx - 6},${y}"/><circle class="dot" cx="${lx}" cy="${y}" r="4.5" stroke="${c}"/>
      <rect x="${lx - 8}" y="${y - rh / 2}" width="${W - lx + 8}" height="${rh}" fill="transparent"/>
      <text class="alln" x="${lx + 12}" y="${y + 4}">${esc(r[0].replace(/ \(.*\)/, ''))}</text><text class="allv" x="${W - 2}" y="${y - 2}" text-anchor="end">${repA(r)}</text><text class="allf" x="${W - 2}" y="${y + 12}" text-anchor="end">FC ${fc}</text></g>`; }).join('');
  host.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Échelle des allures avec les zones et les repères">${tk}${zb}${rows}</svg>`;
  const svg = host.querySelector('svg');
  // ligne pointillée discrète entre le nom (à gauche) et l'allure / FC (à droite), mesurée une fois le texte posé
  svg.querySelectorAll('.alp').forEach(g => { const n = g.querySelector('.alln'), v = g.querySelector('.allv'), fc = g.querySelector('.allf'); if (!n || !v) return;
    const room = W - 2 - Math.max(v.getComputedTextLength(), fc.getComputedTextLength()) - 6 - +n.getAttribute('x'), sh = AL.rep[+g.dataset.i][5];
    if (n.getComputedTextLength() > room && sh) n.textContent = sh;   // nom trop long sur écran étroit : forme courte (EF…)
    const x1 = +n.getAttribute('x') + n.getComputedTextLength() + 8, x2 = W - 2 - Math.max(v.getComputedTextLength(), fc.getComputedTextLength()) - 8, y = +n.getAttribute('y') - 4;
    if (x2 - x1 > 12) n.insertAdjacentHTML('beforebegin', `<line class="alrl" x1="${x1.toFixed(1)}" x2="${x2.toFixed(1)}" y1="${y}" y2="${y}"/>`); });
  return { show: i => { svg.querySelectorAll('.alp.on').forEach(e => e.classList.remove('on')); svg.querySelector(`.alp[data-i="${i}"]`).classList.add('on'); } };
}

/* récupération FC 60 s après les répétitions (fetch_hrr.py) : un point par fractionné, médiane glissante sur 5 séances */
function drawHRR(box, L, C) {
  box.innerHTML = '';
  const W = Math.max(box.clientWidth, 260), H = PCH(190, 230), ml = 8, mr = 50, mt = 14, mb = 24, pw = W - ml - mr, ph = H - mt - mb;
  const x0 = dn(L[0][0]), x1 = dn(L[L.length - 1][0]), vs = L.map(r => r[1]);
  const lo = Math.floor(Math.min(...vs) / 5) * 5, hi = Math.ceil(Math.max(...vs) / 5) * 5 || lo + 5;
  const X = x => ml + (x - x0) / Math.max(1, x1 - x0) * pw, Y = v => mt + (hi - v) / (hi - lo) * ph, f = n => n.toFixed(1);

// Android : Garmin et Campus n'interceptent pas leur adresse web → lien « intent » qui ouvre l'appli (site web si elle n'est pas installée)
const ANDROID = /Android/i.test(navigator.userAgent);
const lienApp = (u, pkg) => ANDROID && pkg ? `intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${pkg};S.browser_fallback_url=${encodeURIComponent(u)};end` : u;
const liensH = () => `<nav class="hl" aria-label="Mes comptes">${LIENS.map(([n, u, pkg, i]) => `<a href="${lienApp(u, pkg)}" target="_blank" rel="noopener" title="${n}" aria-label="${n}"><img src="${i}" alt="" width="16" height="16"></a>`).join('')}</nav>`;
const PPS = { n: 'P1A0E658745', fin: '2027-10-30' };   // Pass Prévention Santé FFA en cours (à refaire après cette date sur pps.athle.fr)
const ppsH = () => { const x = dn(PPS.fin), out = TODAY > x, lvl = out ? ' over' : x - TODAY < 30 ? ' near' : '', d = toDate(x),
    court = [d.getUTCDate(), d.getUTCMonth() + 1, d.getUTCFullYear() % 100].map(v => String(v).padStart(2, '0')).join('/');   // date courte du téléphone
  return `<p class="pps${lvl}" title="Pass Prévention Santé (FFA)">${ico('🩺')}<span class="pn">PPS <b>${PPS.n}</b><button type="button" class="cp" data-copy="${PPS.n}" title="Copier le numéro" aria-label="Copier le numéro de PPS">${CP_SVG}</button></span><span class="pl">${out ? 'expiré le' : 'jusqu’au'} ${fmtD(x, true)}</span><span class="pc">${out ? 'expiré' : 'exp.'} ${court}</span></p>`; };
// bouton copier du PPS : coche verte 1,5 s une fois copié ; repli execCommand si l'API presse-papiers est indisponible
const CP_SVG = `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.5"/><path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H3A1.5 1.5 0 0 0 1.5 3v6A1.5 1.5 0 0 0 3 10.5h.5"/></svg>`;
const OK_SVG = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg>`;
const copier = b => {
  const t = b.dataset.copy, ok = () => { b.innerHTML = OK_SVG; b.classList.add('ok'); b.setAttribute('aria-label', 'Numéro de PPS copié'); clearTimeout(b._t);
    b._t = setTimeout(() => { b.innerHTML = CP_SVG; b.classList.remove('ok'); b.setAttribute('aria-label', 'Copier le numéro de PPS'); }, 1500); };
  const repli = () => { const a = document.createElement('textarea'); a.value = t; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;top:0;opacity:0';
    document.body.appendChild(a); a.select(); try { if (document.execCommand('copy')) ok(); } catch (e) {} a.remove(); };
  navigator.clipboard && window.isSecureContext ? navigator.clipboard.writeText(t).then(ok, repli) : repli();
};
const enteteH = () => `
  <header class="top"><div class="brand">${LOGO}<div><h1>ÉLAN</h1><p class="tag">Tableau de forme</p></div></div><div class="hmeta"><div class="hsub">${liensH()}<p class="muted maj">Données au ${fmtD(TODAY, true)}</p></div>${ppsH()}</div></header>
  <nav class="dock" aria-label="Vue">${VUES.map(([id, l, e]) => `<button data-ver="${id}" class="${S.ver === id ? 'on' : ''}" aria-pressed="${S.ver === id}">${ico(e)}${l}</button>`).join('')}</nav>`;

/* ---------- vue Indicateur : un indicateur à la fois ---------- */
// menu des indicateurs : entraînement sur la 1re ligne, forme et repères sur la 2e (grille 5 × 2 d'icônes sur téléphone)
const CHIPS = ['run', 'velo', 'renfo', 'charge', 'allures', 'sommeil', 'vfc', 'chaussures'];   // pages Heures et VO2max retirées le 19/11/2026 (VO2max : bloc en tête de la page Allures)
const XTRA = { allures: ['🎚️', 'Allures'], chaussures: ['👟', 'Chaussures'] };
const chipsH = () => `<nav class="chips scroll wrapd ind" style="--cols:${Math.ceil(CHIPS.length / 2)};--n:${CHIPS.length}" aria-label="Indicateurs">${CHIPS.map(id => { const [e, l] = XTRA[id] || [MID[id].ico, MID[id].short];
  return `<button class="chip${id === S.m ? ' on' : ''}" data-m="${id}">${ico(e)}<span>${l}</span></button>`; }).join('')}</nav>`;
function renderIndicateur(app) {
  if (S.m === 'chaussures') return renderShoes(app);
  if (S.m === 'allures') return renderAllures(app);
  const m = MID[S.m], R = span(S.range, S.sim && m.sim), sp = specOf(m, R, { mode: modeOf(m) }), h = m.head(R, stOf(m.id));
  app.innerHTML = enteteH() + `
  ${chipsH()}
  ${briefH(m)}
  ${viewsH(m, 'full')}
  <div class="cwrap"><div class="ctot" style="top:${(sp.events || []).length ? 28 : 14}px"><b>${h.val}<small>${h.unit || ''}</small></b>${h.sub ? `<span>${esc(h.sub)}</span>` : ''}</div><div id="a-chart"></div></div>${legend(sp)}
  ${rangesH()}
  <div class="opts${m.id === 'charge' ? ' one' : ''}">${R.hasPrev ? togH('compare', '🔁', 'Période précédente', false, 'Précédente') : ''}${togH('races', '🏁', 'Courses')}${togH('sim', '📅', 'Mois suivant', !m.sim)}${modeH(m)}</div>
  <section class="card"><h2>Tes progrès en un coup d'œil</h2><p>${esc(h.note || '')}</p></section>
  ${m.id === 'charge' ? fosH() + nlH() : ''}
  <section class="card"><h2>Le reste en bref</h2><div class="brief">${M.filter(x => x.id !== S.m && CHIPS.includes(x.id)).map(x => { const k = x.head(R, stOf(x.id)); return `<button class="brow" data-m="${x.id}"><span class="bt">${ico(x.ico)}${x.short}</span><span class="bs" data-spark="${x.id}"></span><span class="bv"><b>${k.val}<small>${k.unit || ''}</small></b>${k.d && k.d.brief !== false ? deltaH(k.d) : ''}</span></button>`; }).join('')}</div></section>`;
  app.style.setProperty('--mc', m.col);
  const room = app.querySelector('.ctot').offsetHeight + 10;   // marge pour le rayon des points ; la courbe grandit d'autant : le total ne masque plus les données
  draw(app.querySelector('#a-chart'), sp, { h: PCH(240, 330) + room, room }); sparks(app, span(S.range)); if (m.id === 'charge') { drawFos(app.querySelector('#c-fos')); drawNL(app.querySelector('#c-nl')); }
  app.querySelectorAll('.bl').forEach(p => { const t = e => { if (e.target.closest('a')) return; p.dataset.an ? showAnalyse(p.dataset.an) : p.dataset.wk ? showSemaine() : p.dataset.nuit ? showNuit(p.dataset.nuit) : p.classList.toggle('open'); }; p.addEventListener('click', t); p.addEventListener('keydown', e => { if (e.key === 'Enter') t(e); }); });
}

/* ---------- rendu et interactions ---------- */
const app = document.getElementById('app');
function render(fade) {
  const sl = (app.querySelector('.chips.scroll') || {}).scrollLeft || 0;
  app.className = 'v-' + S.ver; app.style.removeProperty('--mc'); HIDERS.clear();
  ({ records: renderRecords, trails: renderTrails, agenda: renderAgenda }[S.ver] || renderIndicateur)(app);
  const n = app.querySelector('.chips.scroll'); if (n) n.scrollLeft = sl;
  // après un clic de menu : le contenu apparaît en fondu, les menus restent immobiles
  if (fade) app.querySelectorAll(':scope > :not(.top):not(.dock):not(.chips):not(.seg):not(.ranges):not(.opts)').forEach(e => e.classList.add('fade'));
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.copy) return copier(b);
  if (d.ver) { S.ver = d.ver; window.scrollTo(0, 0); try { history.replaceState(null, '', '#' + d.ver); } catch (err) {} }
  else if (d.rec) S.rec = d.rec;
  else if (d.tv) S.tv = d.tv;
  else if (d.m) { S.m = d.m; if (b.classList.contains('brow')) window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (d.view) S.view[d.for] = d.view;
  else if (d.mode) S.mode[d.for] = d.mode;
  else if (d.range) S.range = d.range;
  else if (d.tog) S[d.tog] = !S[d.tog];
  else return;
  save(); render(true);
});
let rw = window.innerWidth, rt;
window.addEventListener('resize', () => { if (window.innerWidth === rw) return; rw = window.innerWidth; clearTimeout(rt); rt = setTimeout(render, 150); });
render();

</script>
