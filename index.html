<style>
/* Parti pris : écran d'appli de sport, fond sombre unique, un seul orange vif, lettrage géométrique « tableau de bord ». Mobile d'abord. */
:root {
  --bg: #121212; --card: #1C1C1E; --card2: #2C2C30; --line: #323236; --grid: #383838;
  --fg: #FFFFFF; --fg2: #BDBDBD; --fg3: #8C8C8C; --acc: #FC5200; --acc2: #FFB347; --tint: rgba(252, 82, 0, .15);

  --disp: "Orbitron", "Oxanium", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 16px; font-weight: 700; letter-spacing: .03em; }
h3 { font-size: 15px; font-weight: 700; }
.muted { color: var(--fg2); font-size: 13px; }

.e { font-size: 1.1em; line-height: 1; margin-right: .4em; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }

#app { margin: 0 auto; padding-block: 18px 48px; display: flex; flex-direction: column; gap: 14px; max-width: 680px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app.v-frise { max-width: 1120px; }

/* en-tête : logo, titre */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { flex: none; filter: drop-shadow(0 0 10px rgba(252, 82, 0, .5)); }
h1 { font-family: var(--disp); font-size: 27px; font-weight: 800; letter-spacing: .22em; line-height: 1;
  background: linear-gradient(90deg, #fff 25%, var(--acc2) 70%, var(--acc)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tag { margin-top: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--fg2); }
.maj { font-size: 12px; letter-spacing: .04em; }

/* navigation : barre flottante en verre dépoli, qui reste en haut de l'écran pendant le défilement */
.dock { position: sticky; top: max(8px, env(safe-area-inset-top, 0px)); z-index: 30; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px;
  background: rgba(30, 30, 33, .72); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
  border: 1px solid rgba(255, 255, 255, .1); border-radius: 16px; box-shadow: 0 10px 28px rgba(0, 0, 0, .5); }
.dock button { display: flex; align-items: center; justify-content: center; background: none; border: 0; border-radius: 12px; padding: 9px 4px; font-size: 13.5px; font-weight: 700; letter-spacing: .03em; color: var(--fg2); white-space: nowrap; transition: color .15s, background .15s; }
.dock button:hover { color: var(--fg); }
.dock button.on { background: linear-gradient(135deg, var(--acc), #FF7A2E); color: #fff; box-shadow: 0 4px 16px rgba(252, 82, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .25); text-shadow: 0 1px 2px rgba(0, 0, 0, .35); }

/* filtres : étiquettes fines, sélection teintée */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 34px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 34px), transparent); }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px 6px 9px; font-size: 13px; font-weight: 600; letter-spacing: .01em; color: var(--fg2); white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.chip:hover { border-color: #5a5a5f; color: var(--fg); }
.chip.on { background: color-mix(in srgb, var(--mc, var(--acc)) 16%, transparent); border-color: var(--mc, var(--acc)); color: var(--fg); }
.chip[data-row]:not(.on) .e { filter: grayscale(1); opacity: .55; }
.ranges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.ranges button { background: none; border: 0; border-radius: 9px; padding: 7px 4px; font-size: 13px; font-weight: 700; color: var(--fg2); white-space: nowrap; }
.ranges button:hover { color: var(--fg); }
.ranges button.on { background: var(--acc); color: #fff; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tog { display: inline-flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; font-size: 12.5px; font-weight: 600; color: var(--fg2); transition: border-color .15s, color .15s; }
.tog i { position: relative; flex: none; width: 26px; height: 14px; margin-left: 8px; border-radius: 999px; background: #47474c; transition: background .15s; }
.tog i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #c9c9c9; transition: transform .15s, background .15s; }
.tog.on { color: var(--fg); border-color: #5a5a5f; }

.seg::-webkit-scrollbar { display: none; }

.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--card2); color: var(--fg); }
.seg.sm button { padding: 3px 8px; font-size: 11.5px; }

/* chiffres */

.big { font-size: 44px; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }

/* graphiques */

.tr { display: flex; align-items: baseline; gap: 6px; }

.tr span { color: var(--fg2); flex: 1; min-width: 0; } .tr em { font-style: normal; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

/* liens vers l'activité Strava */
.tl { color: var(--acc2); font-weight: 700; text-decoration: none; pointer-events: auto; }
.tl:hover, .rn a:hover, a.rn:hover { text-decoration: underline; }
.tip .tl { display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid #4A4A4A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tip .tw { margin-top: 6px; border-top: 1px solid #4A4A4A; }
.tip .ta { display: flex; gap: 8px; margin: 0; padding: 6px 0 0; border: 0; } .tip .ta span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; } .tip .ta em { font-style: normal; color: var(--fg2); font-weight: 600; }
.cdate .tl { display: inline-block; max-width: min(46vw, 260px); overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
a.rn, .rn a { color: var(--fg); text-decoration: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend i.ln { height: 3px; width: 14px; background: var(--c); }
.legend i.dash { height: 0; width: 14px; border-top: 2px dashed var(--c); border-radius: 0; }
.legend i.pt { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

.legend i.evi { width: 0; height: 12px; border-left: 2px dotted #fff; opacity: .6; border-radius: 0; }
i.gh { background: color-mix(in srgb, var(--c) 30%, transparent); border: 1px dashed var(--c); }

/* cartes */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card > p { color: var(--fg); font-size: 15px; }
.brief { display: flex; flex-direction: column; }
.brow { display: grid; grid-template-columns: minmax(104px, 1fr) minmax(56px, 1.1fr) auto; align-items: center; gap: 12px; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; text-align: left; }
.brow:first-child { border-top: 0; }
.bt { font-weight: 600; font-size: 14px; white-space: nowrap; } .bs { min-width: 0; }
.bv { text-align: right; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.bv b { font-size: 16px; font-weight: 800; } .bv .delta { font-size: 11px; font-weight: 600; color: var(--fg2); }
.races { display: flex; flex-direction: column; }
.race { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.race > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; } .race > div:last-child { text-align: right; }
.race:first-child { border-top: 0; }
.rd { color: var(--fg2); font-size: 12px; } .rn { font-weight: 600; overflow-wrap: anywhere; }
.race b { font-variant-numeric: tabular-nums; text-align: right; } .rk, .rp { color: var(--fg2); font-size: 12px; } .rp { text-align: right; }

/* vue Frise */
.stick { position: sticky; top: calc(max(8px, env(safe-area-inset-top, 0px)) + 50px); z-index: 20; background: var(--bg); padding-block: 8px; margin-block: -8px; border-bottom: 1px solid var(--line); display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.stick .ranges { flex: 1; max-width: 420px; }
.cdate { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.hint { margin-top: -4px; }
.rows { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; }
.row { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.rh { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; min-width: 0; }
.rv { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--acc); }
.rc { min-width: 0; }
/* vue Records */
.rtiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .rtile:first-child { grid-column: 1 / -1; }
.rtile { display: flex; flex-direction: column; gap: 1px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; color: var(--fg2); min-width: 0; transition: background .15s, border-color .15s; }
.rtile:hover { border-color: #5a5a5f; }
.rtile .rl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.rtile b { font-size: 25px; font-weight: 800; line-height: 1.2; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }

.rtile.on { background: color-mix(in srgb, var(--mc) 15%, transparent); border-color: var(--mc); box-shadow: 0 0 18px color-mix(in srgb, var(--mc) 22%, transparent); }
.rtile.on b { color: var(--mc); }
.rdet { display: flex; flex-direction: column; gap: 6px; }
.rchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.rchip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--fg2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rchip b { color: var(--fg); font-weight: 700; }
.rdot { cursor: pointer; outline: none; }

.halo { opacity: .28; transform-box: fill-box; transform-origin: center; }

.tip .tt { font-size: 17px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; }
.legend i.hl { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent); }
.legend i.op { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--c); }
.pj { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.pj b { font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.how summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--acc2); }
.how ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--fg2); }
.rrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.rrow:first-child { border-top: 0; }
.rrow .rd { padding-top: 3px; font-weight: 700; }
.rt b { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.rrow.cur .rt b { color: var(--mc, var(--acc2)); }
.rb { margin-left: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; font-size: 10.5px; font-weight: 700; color: var(--fg2); white-space: nowrap; vertical-align: 2px; }
.rb.now { background: var(--mc, var(--acc)); border-color: var(--mc, var(--acc)); color: #111; }

  @keyframes pulse { 0% { transform: scale(.7); opacity: .4; } 70%, 100% { transform: scale(1.6); opacity: 0; } }
}
/* vue Trails */
.tk { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tki { display: flex; flex-direction: column; gap: 1px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; min-width: 0; }
.tki .rl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); }
.tki b { font-size: 23px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
.trow, .tedi { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.trow:first-child { border-top: 0; } .tedi { grid-template-columns: 40px minmax(0, 1fr) auto; padding: 7px 0; border-top: 0; }
.trow > div, .tedi > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.trow .rr b, .tedi .rr b { font-size: 15px; font-weight: 800; color: var(--fg); }
.tsub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .card > p.note { font-size: 13px; color: var(--fg2); margin-top: -4px; }
.tdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; }
.tyh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.tyh:first-of-type { margin-top: 0; } .tyh h3 { font-family: var(--disp); font-size: 18px; } .tyh span { font-size: 12px; color: var(--fg2); text-align: right; }
.trep { padding: 10px 0 4px; border-top: 1px solid var(--line); } .trep:first-of-type { border-top: 0; padding-top: 0; }
.trep h3 { font-size: 15px; } .ty { font-weight: 800; color: var(--acc2); font-variant-numeric: tabular-nums; }
.rr .gain { color: #3DDC97; font-weight: 700; } .rr .loss { color: #FF6B6B; font-weight: 700; }
@media (max-width: 480px) { .dock button { flex-direction: column; gap: 1px; padding: 6px 2px; font-size: 11.5px; letter-spacing: .02em; } .dock button .e { margin: 0; } }
@media (min-width: 760px) {
  .tk { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .rtiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .rtile:first-child { grid-column: auto; }

  h1 { font-size: 32px; } .hero .big { font-size: 52px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

</style>

<script>
/* ---------- outils ---------- */
const D = window.DASH_DATA, DAY = 864e5;
const dn = s => { const p = s.split('-'); return Math.round(Date.UTC(+p[0], p[1] - 1, +p[2]) / DAY); };
const toDate = n => new Date(n * DAY);
const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const MOISC = ['JANV', 'FÉVR', 'MARS', 'AVR', 'MAI', 'JUIN', 'JUIL', 'AOÛT', 'SEPT', 'OCT', 'NOV', 'DÉC'];
const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const fmtD = (n, y) => { const d = toDate(n); return d.getUTCDate() + ' ' + MOIS[d.getUTCMonth()] + (y ? ' ' + d.getUTCFullYear() : ''); };
const fmtDJ = n => JOURS[toDate(n).getUTCDay()] + ' ' + fmtD(n, true);
const monday = n => n - ((toDate(n).getUTCDay() + 6) % 7);
const nf = (v, d = 0) => v == null || isNaN(v) ? '–' : v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });

const fmtDur = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ' h ' + String(m).padStart(2, '0') : m) + (h ? '' : ':' + String(ss).padStart(2, '0')); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = a => a.reduce((s, v) => s + v, 0);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

D.acts.forEach(a => a.x = dn(a.d)); D.days.forEach(d => d.x = dn(d.d));

const DMAP = new Map(D.days.map(d => [d.x, d]));
const TODAY = dn(D.gen), CUR = monday(TODAY), FIRST = monday(D.acts[0].x);
const RANGES = [
  { id: '1m', l: '1 mois', w: 4, prev: 'au mois précédent', on: 'sur 4 semaines' },
  { id: '3m', l: '3 mois', w: 12, prev: 'aux 3 mois précédents', on: 'sur 3 mois' },
  { id: '6m', l: '6 mois', w: 26, prev: 'aux 6 mois précédents', on: 'sur 6 mois' },
  { id: '1a', l: '1 an', w: 52, prev: '', on: 'sur 1 an' }];
const SIMW = 4;   // semaines simulées après la semaine en cours
function span(id, sim) {
  const r = RANGES.find(x => x.id === id), x0 = CUR - 7 * (r.w - 1), p0 = x0 - 7 * r.w, ws = sim ? SIMW : 0;
  return { id, w: r.w, ws, x0, x1: CUR + 6, xe: CUR + 6 + 7 * ws, p0, hasPrev: p0 >= FIRST, prevLbl: r.prev, on: r.on, lbl: r.l };
}
function weekly(x0, w, pred, val, src = D.acts) {
  const out = Array.from({ length: w }, (_, i) => ({ x: x0 + 7 * i, v: 0 }));
  for (const a of src) { const i = Math.floor((a.x - x0) / 7); if (i >= 0 && i < w && pred(a)) out[i].v += val(a) || 0; }
  return out;
}
const dayPts = (key, a, b) => D.days.filter(d => d.x >= a && d.x <= b && d[key] != null).map(d => ({ x: d.x, v: d[key] }));
function roll7(key, a, b) {
  const out = [];
  for (let x = a; x <= Math.min(b, TODAY); x++) {
    let s = 0, n = 0;
    for (let k = 0; k < 7; k++) { const d = DMAP.get(x - k); if (d && d[key] != null) { s += d[key]; n++; } }
    if (n >= 4) out.push({ x, v: s / n });
  }
  return out;
}
function rollN(pts, n) { return pts.map((p, i) => { const w = pts.slice(Math.max(0, i - n + 1), i + 1); return { x: p.x, v: sum(w.map(q => q.v)) / w.length }; }).filter((p, i) => i >= 2); }

/* ---------- séances prévues sur Nolio : ce qui manque est estimé d'après les 12 dernières semaines ---------- */
const FOOT = r => r.te === 'RECOVERY' || r.te === 'AEROBIC_BASE';
const med = a => { const v = a.filter(x => x != null && isFinite(x)).sort((x, y) => x - y); return v.length ? (v[(v.length - 1) >> 1] + v[v.length >> 1]) / 2 : 0; };
const hab = (f, k) => { let A = D.acts.filter(a => !a.race && a.mn > 0 && a.x > TODAY - 84 && f(a)); if (A.length < 3) A = D.acts.filter(a => !a.race && a.mn > 0 && f(a)); return med(A.map(k)); };
D.plan = (D.plan || []).map(p => {
  const q = Object.assign({ x: dn(p.d) }, p), run = q.t === 'run' || q.t === 'trail', same = a => a.t === q.t, foot = a => a.t === 'run' && a.km > 3;
  const cls = !run ? 0 : /^(EF|SL)(?![a-zé])/i.test(q.n) ? (/activ|tempo/i.test(q.n) ? 1 : 0) : 2;   // 0 footing, 1 sortie mixte, 2 séance
  const rate = hard => hab(a => foot(a) && a.ld && (hard ? !FOOT(a) : FOOT(a)), a => a.ld / a.mn);
  if (q.km == null) q.km = run || q.t === 'renfo' ? 0 : hab(same, a => a.km);
  if (q.mn == null) q.mn = run && q.km ? q.km * hab(foot, a => a.mn / a.km) : hab(same, a => a.mn);
  if (q.dp == null) q.dp = q.km ? q.km * hab(a => same(a) && a.km > 1, a => a.dp / a.km) : 0;
  q.ld = q.mn * (run ? (cls === 1 ? (rate(0) + rate(1)) / 2 : rate(cls)) : hab(a => same(a) && a.ld, a => a.ld / a.mn));
  return q;
}).filter(p => p.x > TODAY && p.x <= CUR + 6 + 7 * SIMW);
/* charge simulée : aiguë = 0,85 × veille + charge du jour ; la chronique rattrape l'aiguë en 14 jours environ (calé sur un an de données Garmin) */
const SIMC = (() => {
  const last = [...D.days].reverse().find(d => d.ac != null); if (!last || !D.plan.length) return [];
  let ac = last.ac, ch = last.ch; const out = [{ x: last.x, ac, ch, rt: last.rt, skip: true }];
  for (let x = last.x + 1; x <= CUR + 6 + 7 * SIMW; x++) { ac = .85 * ac + sum(D.plan.filter(p => p.x === x).map(p => p.ld)); ch += (ac - ch) / 14; out.push({ x, ac, ch, rt: ac / ch }); }
  return out;
})();
const simL = (R, k, name, color) => R.ws && SIMC.length ? [{ name, color, w: 2, dash: true, plan: true, pts: SIMC.map(p => ({ x: p.x, v: p[k], skip: p.skip })) }] : [];

const VH = { id: 'h', l: 'Temps', ico: '⏱️', val: a => a.mn / 60, fmt: fmtH, ax: v => nf(v, v % 1 ? 1 : 0) + ' h', big: v => [fmtH(v), ''] };
const VDP = { id: 'dp', l: 'Dénivelé', ico: '⛰️', val: a => a.dp, fmt: v => nf(v) + ' m', ax: v => nf(v) + ' m', big: v => [nf(v), 'm D+'] };
const VLD = { id: 'ld', l: 'Charge', val: a => a.ld, fmt: v => nf(v), ax: v => nf(v), big: v => [nf(v), 'pts'] };

function weeklyM(id, title, stacks, views, c = {}) {
  const any = a => stacks.some(s => s.pred(a));
  const V = s => views.find(x => x.id === (s && s.view)) || views[0];
  return {
    id, title, short: c.short || title, views: views.length > 1 ? views : null, modes: !c.fixed, weekly: true, sim: true,
    spec(R, s = {}) {
      const v = V(s), N = R.w + R.ws, xs = Array.from({ length: N }, (_, i) => R.x0 + 7 * i);
      const st = stacks.map(k => ({ name: k.name, color: k.color, vals: weekly(R.x0, N, k.pred, v.val).map(p => p.v), pv: R.ws ? weekly(R.x0, N, k.pred, v.val, D.plan).map(p => p.v) : null }));
      const sp = { dom: [R.x0, R.xe], fmt: v.fmt, ax: v.ax, zero: true, weekly: true, lp: any, lines: [] };
      const mode = c.fixed || s.mode || c.mode || 'courbe', tot = i => sum(st.map(k => k.vals[i])), ptot = i => sum(st.map(k => k.pv[i]));
      if (mode === 'barres') sp.bars = { xs, stacks: st.filter(k => k.vals.some(Boolean) || (k.pv && k.pv.some(Boolean))) };
      else {
        sp.lines.push({ name: c.tot || title, color: colOf(id), w: 2.5, area: true, dots: R.w <= 26, tol: 3.5, pts: xs.slice(0, R.w).map((x, i) => ({ x: x + 3, v: tot(i) })) });
        if (R.ws) sp.lines.push({ name: 'Prévu sur Nolio', color: colOf(id), w: 2.5, dash: true, plan: true, dots: R.w <= 26, tol: 3.5, pts: xs.slice(R.w - 1).map((x, j) => { const i = R.w - 1 + j; return { x: x + 3, v: tot(i) + ptot(i), skip: !j && !ptot(i) }; }) });
      }
      if (s.compare && R.hasPrev) sp.lines.push({ name: 'Période précédente', color: GRY, dash: true, w: 1.5, prev: true, tol: 3.5, pts: weekly(R.p0, R.w, any, v.val).map(p => ({ x: p.x + 3 + 7 * R.w, v: p.v })) });
      return sp;
    },
    head(R, s = {}) {
      const v = V(s), wk = weekly(R.x0, R.w, any, v.val), cur = sum(wk.map(p => p.v));
      const [val, unit] = v.big(cur), h = { lbl: 'Total – ' + v.l, val, unit };
      const best = wk.reduce((a, b) => b.v > a.v ? b : a, wk[0]);
      h.note = `Tu as cumulé ${v.fmt(cur)} ${R.on}`;
      if (R.hasPrev) {
        const p = sum(weekly(R.p0, R.w, any, v.val).map(q => q.v));
        if (p > 0) {
          const pct = (cur - p) / p * 100;
          h.d = { txt: nf(Math.abs(pct)) + ' %', dir: Math.sign(Math.round(pct)), lbl: 'par rapport ' + R.prevLbl };
          h.note += `, soit une ${pct < 0 ? 'baisse' : 'hausse'} de ${nf(Math.abs(pct))} % par rapport aux ${v.fmt(p)} de la période précédente`;
        }
      }
      h.note += `. Plus grosse semaine : ${v.fmt(best.v)} (semaine du ${fmtD(best.x)}). Moyenne : ${v.fmt(cur / R.w)} par semaine.`;
      if (R.ws) { const tp = sum(weekly(CUR + 7, R.ws, any, v.val, D.plan).map(q => q.v)); h.note += tp ? ` Prévu sur Nolio pour les ${R.ws} semaines à venir : ${v.fmt(tp)}, soit ${v.fmt(tp / R.ws)} par semaine.` : ` Rien de prévu sur Nolio pour les ${R.ws} semaines à venir.`; }
      return h;
    }
  };
}
function dailyM(id, title, key, c) {
  const fmt = c.fmt || (v => nf(v, c.dec || 0) + (c.unit ? ' ' + c.unit : ''));
  const main = (a, b) => c.avg ? roll7(key, a, b) : dayPts(key, a, b);
  return {
    id, title, short: c.short || title, lower: c.lower,
    spec(R, s = {}) {
      const lines = [{ name: c.avg ? 'Moyenne 7 jours' : title, color: colOf(id), w: 2.5, pts: main(R.x0, R.x1), hold: c.hold, dots: c.dots }];
      if (c.avg) lines.push({ name: c.raw || 'Valeur du jour', color: GRY, w: 1, faint: true, pts: dayPts(key, R.x0, R.x1) });
      if (s.compare && R.hasPrev) lines.push({ name: 'Période précédente', color: GRY, dash: true, w: 1.5, prev: true, hold: c.hold, pts: main(R.p0, R.x0 - 1).map(p => ({ x: p.x + 7 * R.w, v: p.v })) });
      const sp = { dom: [R.x0, R.xe], lines, fmt, ax: c.ax || (v => nf(v, Number.isInteger(v) ? 0 : (c.dec || 0)) + (c.unit && c.unit.length <= 3 ? ' ' + c.unit : '')), events: c.events ? c.events.filter(e => e.x >= R.x0 && e.x <= R.x1) : null };
      if (c.band) { sp.band = D.days.filter(d => d.x >= R.x0 && d.x <= R.x1 && d[c.band[0]] != null).map(d => ({ x: d.x, lo: d[c.band[0]], hi: d[c.band[1]] })); sp.bandName = c.bandName; }
      return sp;
    },
    head(R) {
      const pts = main(R.x0, R.x1), raw = dayPts(key, R.x0, R.x1).map(p => p.v);
      if (!pts.length) return { lbl: title, val: '–', unit: '' };
      const a = pts[0].v, b = pts[pts.length - 1].v, df = b - a, parts = fmt(b).split(' ');
      const h = { lbl: title + (c.avg ? ' – moyenne 7 jours' : ''), val: c.fmt ? fmt(b) : parts[0], unit: c.fmt ? '' : (c.unit || '') };
      const dtxt = c.fmt ? fmt(Math.abs(df)) : nf(Math.abs(df), c.dec || 0) + (c.unit ? ' ' + c.unit : '');
      h.d = { txt: dtxt, dir: Math.abs(df) < Math.pow(10, -(c.dec || 0)) / 2 ? 0 : Math.sign(df), lbl: 'depuis le ' + fmtD(pts[0].x) };
      h.note = `${title} : ${fmt(b)} aujourd'hui${c.avg ? ' en moyenne sur 7 jours' : ''}, contre ${fmt(a)} le ${fmtD(pts[0].x)}. Sur la période : mini ${fmt(Math.min(...raw))}, maxi ${fmt(Math.max(...raw))}, moyenne ${fmt(sum(raw) / raw.length)}.` + (c.note ? ' ' + c.note(R, b) : '');

    }
  };
}
function runsM(id, title, c) {

      return { dom: [R.x0, R.xe], fmt, ax: v.ax || c.ax || (y => nf(y)), invert: v.invert, lp: c.pred, lines: [

      h.d = { txt: 'ratio ' + nf(last.rt, 1), dir: 0, lbl: pos };

const fCat = r => r.cat ? ord(r.cat.r) + (r.cat.n ? ' / ' + r.cat.n : '') + ' ' + r.cat.c + (MEDAL[r.cat.r] || '') : '';
/* rp = record battu ce jour-là ; cur = record qui tient aujourd'hui */
const RR = (() => {
  const best = {}, L = REC.races.filter(r => RDIST[r.d]).map(r => Object.assign({}, r, { y: yrOf(r.date), x: dn(r.date), km: RDIST[r.d].km, id: (D.recids || {})[r.date] }));
  L.forEach(r => { if (best[r.d] === undefined || r.t < best[r.d]) { r.rp = true; best[r.d] = r.t; } });
  L.forEach(r => { r.cur = r.t === best[r.d]; });
  return L;
})();
const RT0 = yrOf(REC.t0), RNOW = yrOf(REC.today), RX0 = Math.floor(Math.min(...RR.map(r => r.y))), RX1 = Math.ceil(RNOW) + 1;
const rproj = (t, d) => {
  const M = REC.M, k = REC.K[d], dt = Math.max(0, t - RNOW), b = M.Linf + M.A * Math.exp(-(t - RT0) / M.tau), a = 1 + M.age * dt, w = .004 + .004 * dt;
  return { med: b * a * k.med, lo: b * (1 - w) * k.lo, hi: b * a * (1 + w) * k.hi };
};

function drawRec(box, d) {
  const cfg = RDIST[d], C = cfg.c, K = REC.K[d], races = RR.filter(r => r.d === d);
  box.innerHTML = ''; box.classList.add('chart'); box._grp = null;
  const W = Math.max(box.clientWidth, 260), H = 270, ml = 8, mr = 50, mt = 26, mb = 24, pw = W - ml - mr, ph = H - mt - mb;
  const vals = races.map(r => r.t);
  if (K) for (let t = RNOW; t <= RX1 + 1e-9; t += .25) { const p = rproj(t, d); vals.push(p.lo, p.hi); }
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .12 || 5; lo -= pad; hi += pad;
  const step = [2, 5, 10, 20, 30, 60, 120, 180, 300, 600].find(s => (hi - lo) / s <= 4.5) || 900;
  const X = t => ml + (t - RX0) / (RX1 - RX0) * pw, Y = s => mt + (s - lo) / (hi - lo) * ph, f = n => n.toFixed(1);   // chrono plus rapide = plus haut
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Progression ${cfg.l}">`;
  s += `<rect class="fut" x="${f(X(RNOW))}" y="${mt}" width="${f(X(RX1) - X(RNOW))}" height="${ph}"/>`;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) s += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text class="ytick" x="${W - mr + 8}" y="${f(Y(v) + 4)}">${fTick(v)}</text>`;
  for (let y = RX0; y < RX1; y++) s += `<text class="xtick" x="${f(X(y + .5))}" y="${H - 6}">${y}</text>`;
  if (K) {
    const up = [], dw = [], md = [];
    for (let t = RNOW; t <= RX1 + 1e-9; t += 1 / 24) { const p = rproj(t, d), px = f(X(t)); up.push(px + ',' + f(Y(p.lo))); dw.unshift(px + ',' + f(Y(p.hi))); md.push(px + ',' + f(Y(p.med))); }
    s += `<polygon fill="${C}" opacity=".18" points="${up.concat(dw).join(' ')}"/><polyline fill="none" stroke="${C}" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" points="${md.join(' ')}"/>`;
  }
  const pts = races.map(r => f(X(r.y)) + ',' + f(Y(r.t)));
  if (races.length > 1) s += `<polygon fill="${C}" opacity=".13" points="${pts.join(' ')} ${f(X(races[races.length - 1].y))},${mt + ph} ${f(X(races[0].y))},${mt + ph}"/><polyline fill="none" stroke="${C}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.join(' ')}"/>`;
  s += `<line class="futl" x1="${f(X(RNOW))}" x2="${f(X(RNOW))}" y1="${mt}" y2="${mt + ph}"/><line class="cross" x1="0" x2="0" y1="${mt}" y2="${mt + ph}" visibility="hidden"/>`;
  if (K) s += `<rect class="ov" x="${f(X(RNOW))}" y="${mt}" width="${f(X(RX1) - X(RNOW))}" height="${ph}" fill="transparent"/>`;
  if (d === '21') {
    const p = rproj(yrOf(REC.cannes), d), cx = X(yrOf(REC.cannes));
    s += `<path class="rng" d="M${f(cx)} ${f(Y(p.lo))}V${f(Y(p.hi))}M${f(cx - 4)} ${f(Y(p.lo))}h8M${f(cx - 4)} ${f(Y(p.hi))}h8"/><text class="evl" x="${f(cx)}" y="${f(Y(p.lo) - 7)}">🌴 Cannes</text>`;
    s += `<g class="rdot" tabindex="0" data-cannes="1" transform="translate(${f(cx)},${f(Y(p.med))})" aria-label="Semi de Cannes, projection ${fT(p.med)}"><circle r="13" fill="transparent"/><circle r="3.5" fill="#fff" stroke="var(--bg)" stroke-width="2"/></g>`;
  }
  races.forEach((r, i) => {
    const cx = X(r.y), cy = Y(r.t);
    s += `<g class="rdot" tabindex="0" data-i="${RR.indexOf(r)}" transform="translate(${f(cx)},${f(cy)})" aria-label="${esc(r.name)}, ${fmtD(r.x, true)}, ${fT(r.t)}${r.cur ? ', record actuel' : r.rp ? ', ancien record' : ''}"><circle r="14" fill="transparent"/>${r.cur ? `<circle class="halo" r="11" fill="${C}"/>` : ''}<circle class="rm" r="${r.cur ? 6 : 4.5}" ${r.rp ? `fill="${C}" stroke="var(--bg)"` : `fill="var(--bg)" stroke="${C}"`} stroke-width="2"/></g>`;
    if (r.cur) s += `<text class="rpl" x="${f(cx < 96 ? cx + 12 : cx - 12)}" y="${f(cy - 11)}" text-anchor="${cx < 96 ? 'start' : 'end'}">🏆 ${fT(r.t)}</text>`;
    else if (!i && cfg.first) s += `<text class="ytick" x="${f(cx + 10)}" y="${f(cy + 4)}">${fT(r.t)}</text>`;
  });
  box.insertAdjacentHTML('beforeend', s + '</svg>');
  const tip = el('div', 'tip'); tip.hidden = true; box.appendChild(tip);
  const svg = box.querySelector('svg'), guide = svg.querySelector('.cross'), ov = svg.querySelector('.ov');
  const showTip = (html, px, py) => {
    tip.innerHTML = html; tip.hidden = false; const tw = tip.offsetWidth, th = tip.offsetHeight;
    let lf = px + 14; if (lf + tw > W) lf = px - tw - 14; tip.style.left = Math.max(0, lf) + 'px';
    let top = py - th - 12; if (top < 0) top = py + 16; tip.style.top = top + 'px';
  };
  const hide = () => { tip.hidden = true; guide.setAttribute('visibility', 'hidden'); };
  if (ov) {
    const mv = e => {
      const r = svg.getBoundingClientRect(), t = Math.min(RX1, Math.max(RNOW, RX0 + (e.clientX - r.left - ml) / pw * (RX1 - RX0))), p = rproj(t, d);
      guide.setAttribute('x1', f(X(t))); guide.setAttribute('x2', f(X(t))); guide.setAttribute('visibility', 'visible');
      showTip(`<b>Projection · ${MOIS[Math.min(11, Math.floor(t % 1 * 12))]} ${Math.floor(t)}</b><div class="tt">${fT(p.med)}</div><div class="te">${fT(p.lo)} – ${fT(p.hi)}</div>`, X(t), e.clientY - r.top);

  }

    const show = () => {

      guide.setAttribute('visibility', 'hidden');
      if (g.dataset.cannes) { const p = rproj(yrOf(REC.cannes), d); return showTip(`<b>🌴 Semi de Cannes</b><div class="te">${fmtD(dn(REC.cannes), true)} · projection</div><div class="tt">${fT(p.med)}</div><div class="te">${fT(p.lo)} – ${fT(p.hi)}</div>`, gx, gy); }
      const r = RR[+g.dataset.i], ranks = [fSc(r) ? 'Scratch ' + fSc(r) : '', fCat(r)].filter(Boolean).join(' · ') || (r.pending ? 'Classement à venir' : '');
      showTip(`<b>${r.e ? r.e + ' ' : ''}${esc(r.name)}</b><div class="te">${esc(r.place)} · ${fmtD(r.x, true)}</div><div class="tt">${fT(r.t)}${r.cur ? ' 🏆' : ''}</div><div class="te">${fT(r.t / r.km)}/km${r.watch ? ' · temps montre' : ''}</div>${ranks ? `<div class="te">${ranks}</div>` : ''}${r.id ? `<a class="tl" href="${STRAVA}${r.id}" target="_blank" rel="noopener">Voir l’activité ↗</a>` : ''}`, gx, gy);
    };
    let ptype = 'mouse';
    g.addEventListener('pointerenter', show); g.addEventListener('pointerdown', e => { ptype = e.pointerType; show(); }); g.addEventListener('focus', show);
    g.addEventListener('click', () => { const r = RR[+g.dataset.i]; if (ptype === 'mouse' && r && r.id) window.open(STRAVA + r.id, '_blank', 'noopener'); });
    g.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  });
  svg.addEventListener('pointerdown', e => { if (!e.target.closest('.rdot') && !e.target.classList.contains('ov')) hide(); });
  HIDERS.add({ host: box, hide, group: null });
}

/* ---------- vue Trails : tous les trails terminés (classements Betrail, liens Strava), éditions comparées ---------- */
const TCLS = [   // classe d'après les km-effort (km + D+ / 100)
  { k: 'court', l: 'Court', c: '#2DD4BF', max: 40 },
  { k: 'long', l: 'Long', c: '#3FA7F5', max: 80 },
  { k: 'ultra', l: 'Ultra', c: '#FC5200', max: Infinity }];
const TT = (D.trails || []).map(r => { const ke = r.km + (r.dp || 0) / 100;
  return Object.assign({}, r, { x: dn(r.d), y: yrOf(r.d), yr: r.d.slice(0, 4), ke, cl: TCLS.find(c => ke < c.max), top: r.rk && r.n ? r.rk / r.n : null }); });
const pct = p => Math.max(1, Math.round(p * 100)) + ' %';
const BETRAIL = 'https://www.betrail.run/race/';
const sameP = (a, b) => Math.abs(a.km - b.km) <= .05 * b.km && Math.abs(a.dp - b.dp) <= .12 * Math.max(b.dp, 1);   // même parcours, chronos comparables

const tRank = r => r.rk ? `${ord(r.rk)}${r.n ? ' / ' + nf(r.n) : ''}` : 'hors Betrail';
const tName = r => r.sid ? `<a href="${STRAVA}${r.sid}" target="_blank" rel="noopener">${esc(r.nm)} ↗</a>` : esc(r.nm);
const tTip = r => `<b>${esc(r.nm)}</b><div class="te">${esc([tSub(r), fmtD(r.x, true)].filter(Boolean).join(' · '))}</div><div class="tt">${fT(r.t)}</div>`

  app.innerHTML = enteteH() + `
  <p class="muted">${L.length} trails terminés depuis ${L[0].yr}, dont ${ul} ultra${ul > 1 ? 's' : ''}.</p>
  <div class="tk">${tiles.map(([e, l, v]) => `<div class="tki"><span class="rl">${ico(e)}${l}</span><b>${v}</b></div>`).join('')}</div>
  <div class="rchips"><span class="rchip">Le plus long <b>${nf(longest.km)} km</b> · ${esc(longest.nm)}</span>${best ? `<span class="rchip">Meilleur classement <b>top ${pct(best.top)}</b> · ${esc(best.nm)} ${best.yr}</span>` : ''}</div>
  <section class="card"><h2>🏅 Classement à chaque trail</h2><p class="muted note">Place parmi les finishers : plus le point est haut, mieux tu es classé.</p><div id="t-chart"></div>
    <div class="legend">${TCLS.map(c => `<span><i class="pt" style="--c:${c.c}"></i>${c.l}</span>`).join('')}<span>taille du point = km-effort</span></div></section>
  ${G.length ? `<section class="card"><h2>🔁 Courues plusieurs fois</h2>${G.map(repH).join('')}</section>` : ''}
  <section class="card"><h2>📋 Tous les trails</h2>${Object.keys(Y).sort().reverse().map(y => `<div class="tyh"><h3>${y}</h3><span>${tot(Y[y])}</span></div><div class="races">${[...Y[y]].reverse().map(trowH).join('')}</div>`).join('')}</section>
  <p class="muted simn">Classement scratch et nombre de finishers : Betrail. Km et D+ officiels de chaque course. Court : moins de 40 km-effort, long : 40 à 80, ultra : 80 et plus (km-effort = km + D+ / 100). Écart de chrono affiché seulement quand le parcours est le même.${hors ? ' Trails absents de Betrail : chrono, km et D+ Strava.' : ''}</p>`;
  app.style.setProperty('--mc', '#FC5200');
  drawTrails(app.querySelector('#t-chart'));
}

/* ---------- état ---------- */
const VUES = [['indicateur', 'Indicateur', '🎯'], ['frise', 'Frise', '🎞️'], ['records', 'Records', '🏆'], ['trails', 'Trails', '⛰️']];
const S = { ver: 'indicateur', range: '3m', races: true, compare: false, sim: false, m: 'run', rec: '21', view: {}, mode: {}, rows: new Set(['run', 'heures', 'charge', 'vo2', 'vfc', 'sommeil', 'renfo']) };
try { const p = JSON.parse(localStorage.getItem('tableau-forme') || '{}'); if (p.range) S.range = p.range; if (p.ver) S.ver = p.ver; if (p.m && MID[p.m]) S.m = p.m; if (p.sim) S.sim = true; if (p.rec) S.rec = p.rec; if (Array.isArray(p.rows)) S.rows = new Set(p.rows.filter(id => MID[id])); } catch (e) {}
const hv = (location.hash || '').replace('#', ''); if (VUES.some(v => v[0] === hv)) S.ver = hv;
if (!VUES.some(v => v[0] === S.ver)) S.ver = 'indicateur';
const save = () => { try { localStorage.setItem('tableau-forme', JSON.stringify({ range: S.range, ver: S.ver, m: S.m, sim: S.sim, rec: S.rec, rows: [...S.rows] })); } catch (e) {} };
const stOf = id => ({ view: S.view[id], mode: S.mode[id], compare: S.compare });
function specOf(m, R, extra) {
  const sp = m.spec(R, Object.assign(stOf(m.id), extra));
  if (S.races) sp.events = (sp.events || []).concat(RACES.filter(r => r.x >= R.x0 && r.x <= R.x1));
  return sp;
}
const modeOf = m => S.mode[m.id] || 'courbe';
const ico = e => e ? `<span class="e" aria-hidden="true">${e}</span>` : '';
const deltaH = d => d ? `<span class="delta">${d.dir > 0 ? '<i>▲</i>' : d.dir < 0 ? '<i>▼</i>' : ''}${esc(d.txt)}</span>` : '';
const rangesH = () => `<div class="ranges" role="group" aria-label="Période">${RANGES.map(r => `<button data-range="${r.id}" class="${r.id === S.range ? 'on' : ''}">${r.l}</button>`).join('')}</div>`;
const viewsH = (m, cls = '') => m.views ? `<div class="seg ${cls}" role="group" aria-label="Vue">${m.views.map(v => `<button class="${(S.view[m.id] || m.views[0].id) === v.id ? 'on' : ''}" data-view="${v.id}" data-for="${m.id}">${ico(v.ico)}${v.l}</button>`).join('')}</div>` : '';
const modeH = m => m.modes ? `<div class="seg" role="group" aria-label="Type de graphique">${[['courbe', 'Courbe', '📈'], ['barres', 'Barres', '📊']].map(([k, l, e]) => `<button data-mode="${k}" data-for="${m.id}" class="${modeOf(m) === k ? 'on' : ''}">${ico(e)}${l}</button>`).join('')}</div>` : '';
const togH = (key, e, label, off) => `<button class="tog${S[key] && !off ? ' on' : ''}" data-tog="${key}" aria-pressed="${!!S[key] && !off}"${off ? ' disabled title="Pas de projection pour cet indicateur"' : ''}>${ico(e)}${label}<i></i></button>`;
const simH = R => !R.ws ? '' : `<p class="muted simn">${D.plan.length ? `📅 Simulation jusqu'au ${fmtD(R.xe)} avec les séances prévues sur Nolio. Les durées non renseignées et la charge sont estimées d'après tes 12 dernières semaines.` : '📅 Aucune séance prévue sur Nolio pour les semaines à venir.'}</p>`;
function racesH(R) {
  const L = RACES.filter(r => r.x >= R.x0 && r.x <= R.x1).reverse();
  if (!L.length) return '<p class="muted">Aucune course sur la période.</p>';
  return `<div class="races">${L.map(r => `<div class="race"><span class="rd">${fmtD(r.x)}</span><div>${r.id ? `<a class="rn" href="${STRAVA}${r.id}" target="_blank" rel="noopener">${esc(r.n)} ↗</a>` : `<span class="rn">${esc(r.n)}</span>`}<span class="rk">${nf(r.km, 1)} km${r.dp > 300 ? ' · ' + nf(r.dp) + ' m D+' : ''}</span></div><div><b>${fmtDur(r.el)}</b><span class="rp">${r.lbl === 'Relais' ? '' : fmtPace(r.el / 60 / r.km) + ' /km'}</span></div></div>`).join('')}</div>`;
}
const sparks = (root, R) => root.querySelectorAll('[data-spark]').forEach(e => draw(e, MID[e.dataset.spark].spec(R, { view: S.view[e.dataset.spark], mode: 'courbe' }), { spark: true, h: 34 }));
const LOGO = `<svg class="logo" viewBox="0 0 48 48" width="46" height="46" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FC5200"/><stop offset="1" stop-color="#FFB347"/></linearGradient></defs><path d="M14 5H43V34L34 43H5V14Z" fill="url(#lg)" stroke="url(#lg)" stroke-width="4" stroke-linejoin="round"/><path d="M10 30h6l3.5-7 4.5 12 6.5-21 4.5 11h3.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const enteteH = () => `
  <header class="top"><div class="brand">${LOGO}<div><h1>ÉLAN</h1><p class="tag">Tableau de forme</p></div></div><p class="muted maj">Données au ${fmtD(TODAY, true)}</p></header>
  <nav class="dock" aria-label="Vue">${VUES.map(([id, l, e]) => `<button data-ver="${id}" class="${S.ver === id ? 'on' : ''}" aria-pressed="${S.ver === id}">${ico(e)}${l}</button>`).join('')}</nav>`;

/* ---------- vue Indicateur : un indicateur à la fois ---------- */
function renderIndicateur(app) {
  const m = MID[S.m], R = span(S.range, S.sim && m.sim), sp = specOf(m, R, { mode: modeOf(m) }), h = m.head(R, stOf(m.id));
  app.innerHTML = enteteH() + `
  <nav class="chips scroll" aria-label="Indicateur">${M.map(x => `<button class="chip${x.id === S.m ? ' on' : ''}" data-m="${x.id}">${ico(x.ico)}${x.short}</button>`).join('')}</nav>
  <section class="hero"><div><p class="lbl">${esc(h.lbl)}</p><p class="big">${h.val}<small>${h.unit || ''}</small></p><p class="muted">${fmtD(R.x0, true)} – ${fmtD(R.x1, true)}</p></div>
    ${h.d ? `<div class="hd">${deltaH(h.d)}<p class="muted">${esc(h.d.lbl)}</p></div>` : ''}</section>
  ${viewsH(m)}
  <div id="a-chart"></div>${legend(sp)}${simH(R)}
  ${rangesH()}
  <div class="opts">${R.hasPrev ? togH('compare', '🔁', 'Période précédente') : ''}${togH('races', '🏁', 'Courses')}${togH('sim', '📅', 'Mois suivant', !m.sim)}${modeH(m)}</div>
  <section class="card"><h2>Tes progrès en un coup d'œil</h2><p>${esc(h.note || '')}</p></section>
  <section class="card"><h2>Le reste en bref</h2><div class="brief">${M.filter(x => x.id !== S.m).map(x => { const k = x.head(R, stOf(x.id)); return `<button class="brow" data-m="${x.id}"><span class="bt">${ico(x.ico)}${x.short}</span><span class="bs" data-spark="${x.id}"></span><span class="bv"><b>${k.val}<small>${k.unit || ''}</small></b>${k.d && k.d.brief !== false ? deltaH(k.d) : ''}</span></button>`; }).join('')}</div></section>
  <section class="card"><h2>Courses</h2>${racesH(R)}</section>`;
  app.style.setProperty('--mc', m.col);
  draw(app.querySelector('#a-chart'), sp, { h: 320 }); sparks(app, span(S.range));
}

/* ---------- vue Frise : tous les indicateurs sur le même axe de temps ---------- */
function renderFrise(app) {
  const R = span(S.range, S.sim), on = M.filter(m => S.rows.has(m.id));
  app.innerHTML = enteteH() + `
  <div class="stick">${rangesH()}<p class="cdate" id="c-date">${fmtD(R.x0, true)} – ${fmtD(R.xe, true)}</p></div>
  <nav class="chips scroll wrapd" aria-label="Lignes affichées">${M.map(x => `<button class="chip${S.rows.has(x.id) ? ' on' : ''}" data-row="${x.id}" style="--mc:${x.col}" aria-pressed="${S.rows.has(x.id)}">${ico(x.ico)}${x.short}</button>`).join('')}</nav>
  <div class="opts">${togH('races', '🏁', 'Courses')}${togH('sim', '📅', 'Mois suivant')}</div>
  <p class="muted hint">Touche ou survole un graphique : la même date est lue sur toutes les lignes.</p>${simH(R)}
  ${on.length ? `<section class="rows">${on.map(m => { const k = m.head(R, stOf(m.id)); return `<div class="row"><div class="rh"><h3>${ico(m.ico)}${m.short}</h3><p class="rv" style="color:${m.col}" data-rv="${m.id}" data-def="${esc(k.val + (k.unit ? ' ' + k.unit : ''))}">${k.val}${k.unit ? ' ' + k.unit : ''}</p>${viewsH(m, 'sm')}</div><div class="rc" data-chart="${m.id}"></div></div>`; }).join('')}</section>` : '<p class="muted">Aucune ligne affichée : active un indicateur ci-dessus.</p>'}
  <section class="card"><h2>Courses</h2>${racesH(R)}</section>`;
  const charts = [], cd = app.querySelector('#c-date'), defDate = cd.textContent;
  const hover = (x, lk) => {
    charts.forEach(c => { c.ch.show(x, true); const e = app.querySelector(`[data-rv="${c.id}"]`);
      if (x == null) e.textContent = e.dataset.def; else { const rows = c.ch.at(x), t = rows.find(r => r.tot); e.textContent = t ? t.txt : (rows.filter(r => !r.small).slice(0, 2).map(r => r.txt.split(' · ')[0]).join(' · ') || '–'); } });
    cd.innerHTML = x == null ? esc(defDate) : esc(fmtDJ(x) + (x > TODAY ? ' · à venir' : '')) + (lk ? ' · ' + (lk.acts ? lk.acts.map(a => `<a class="tl" href="${STRAVA}${a.id}" target="_blank" rel="noopener">${jourC(a.x)} ${esc(a.n)}</a>`).join(' · ') : `<a class="tl" href="${lk.href}" target="_blank" rel="noopener">${esc(lk.n)} ↗</a>`) : '');
  };
  app.querySelectorAll('[data-chart]').forEach((e, i) => { const m = MID[e.dataset.chart], sp = specOf(m, R, { mode: modeOf(m), compare: false });
    charts.push({ id: m.id, ch: draw(e, sp, { h: i === on.length - 1 ? 128 : (i === 0 ? 124 : 104), xAxis: i === on.length - 1, evLabels: i === 0, ticks: 2, onHover: hover, group: 'frise' }) }); });
}

/* ---------- rendu et interactions ---------- */
const app = document.getElementById('app');
function render() {
  const sl = (app.querySelector('.chips.scroll') || {}).scrollLeft || 0;
  app.className = 'v-' + S.ver; app.style.removeProperty('--mc'); HIDERS.clear();
  ({ frise: renderFrise, records: renderRecords, trails: renderTrails }[S.ver] || renderIndicateur)(app);
  const n = app.querySelector('.chips.scroll'); if (n) n.scrollLeft = sl;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.ver) { S.ver = d.ver; window.scrollTo(0, 0); try { history.replaceState(null, '', '#' + d.ver); } catch (err) {} }
  else if (d.rec) S.rec = d.rec;
  else if (d.m) { S.m = d.m; if (b.classList.contains('brow')) window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (d.view) S.view[d.for] = d.view;
  else if (d.mode) S.mode[d.for] = d.mode;
  else if (d.range) S.range = d.range;
  else if (d.tog) S[d.tog] = !S[d.tog];
  else if (d.row) { S.rows.has(d.row) ? S.rows.delete(d.row) : S.rows.add(d.row); }
  else return;
  save(); render();
});
let rw = window.innerWidth, rt;
window.addEventListener('resize', () => { if (window.innerWidth === rw) return; rw = window.innerWidth; clearTimeout(rt); rt = setTimeout(render, 150); });
render();

</script>
</body>
</html>
